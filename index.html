  :`<div class="empty">Nenhum aviso por enquanto.</div>`}
 ${pushOK()&&Notification.permission!=="granted"?`<button class="btn line" data-act="enableNotif">🔔 Receber avisos também com o app fechado</button>`:""}</div>`);
 if(L.some(x=>!x.read_at)){sb.rpc("mark_notifications_read",{p_ids:null}).then(()=>{L.forEach(x=>{if(!x.read_at)x.read_at=new Date().toISOString()});render()}).catch(()=>{})}}
A.notifOpen=()=>notifView();
A.notifGo=el=>{const n=NOTIF.list.find(x=>x.id===el.dataset.v);closeModal();if(!n)return;notifRoute(n.url||"/")};
function notifRoute(u){try{const q=new URL(u,location.origin).searchParams;const t=q.get("t"),go=q.get("go");if(t)UI.pendTeam={id:t,go:go||"home"}}catch(e){}notifApply()}
function notifApply(){const p=UI.pendTeam;if(!p)return;if(!TEAMS){if(typeof teamsLoad==="function")teamsLoad();return}
 UI.pendTeam=null;const tm=TEAMS.find(x=>x.id===p.id);if(!tm){toast("Você não faz mais parte dessa equipe.");return}
 if(!TEAM||TEAM.id!==tm.id)teamEnter(tm.id,true);
 if(p.go==="chal"){UI.tab="chal";UI.chalOpen=null}else if(p.go==="tasks"){UI.tab="agenda";UI.agendaSub="tasks";UI.teamWho="eu"}else if(p.go==="proj"){UI.tab="agenda";UI.agendaSub="proj";UI.projOpen=null;UI.projF="minhas"}else UI.tab="home";
 window.scrollTo(0,0);render()}
/* link da notificação (?t=equipe&go=aba) */
try{const q=new URLSearchParams(location.search);if(q.get("t")){UI.pendTeam={id:q.get("t"),go:q.get("go")||"home"};history.replaceState({},"",location.pathname)}}catch(e){}
if(navigator.serviceWorker)navigator.serviceWorker.addEventListener("message",ev=>{if(ev.data&&ev.data.type==="prumo-open")notifRoute(ev.data.url);if(ev.data&&ev.data.type==="prumo-push"){NOTIF.loading=false;notifLoad()}});

let pushChecked=false;
{const _rn=render;render=function(){_rn();try{if(!Store.cloud||Store.demo||UI.needAuth||!S.profile.created)return;
 if(!NOTIF.t&&!NOTIF.loading)setTimeout(notifLoad,0);
 if(!pushChecked&&pushOK()&&Notification.permission==="granted"){pushChecked=true;setTimeout(()=>pushSubscribe(false),1500)}
 if(UI.pendTeam&&TEAMS)setTimeout(notifApply,0);
 const top=document.querySelector("#app .top");const un=NOTIF.list.filter(x=>!x.read_at).length;
 if(top&&(NOTIF.list.length||TEAMS&&TEAMS.length)&&!document.getElementById("bellBtn")){const ref=top.querySelector(".streak");const h=`<button id="bellBtn" class="iconbtn" data-act="notifOpen" aria-label="Avisos${un?`: ${un} novos`:""}" style="position:relative">${I.bell}${un?`<span class="supdot" style="background:var(--bad);font-size:10px;font-weight:800;width:18px;height:18px">${un>9?"9+":un}</span>`:""}</button>`;if(ref)ref.insertAdjacentHTML("beforebegin",h);else top.insertAdjacentHTML("beforeend",h)}}catch(e){}}}

/* convite para ativar as notificações (na tela da equipe) */
{const _vt=viewTeamHome;viewTeamHome=function(){let h=_vt();let off=false;try{off=localStorage.getItem("prumo.pushAsk")==="no"}catch(e){}
 if(!Store.demo&&pushOK()&&Notification.permission==="default"&&!off)h=h.replace(/(<h1[^>]*>[^<]*<\/h1>)/,`$1<div class="banner info">${I.bell.replace('<svg','<svg width="20" height="20" style="flex:none"')}<div class="stack-s" style="gap:6px"><span>Quer ser avisado quando te passarem uma tarefa ou alguém postar no desafio?</span><div class="row" style="gap:6px"><button class="btn sm" data-act="enableNotif">Ativar notificações</button><button class="btn ghost sm" data-act="pushNo">Agora não</button></div></div></div>`);
 return h}}
A.pushNo=()=>{try{localStorage.setItem("prumo.pushAsk","no")}catch(e){}render()};

/* ---------- disparos ---------- */
function teamNotify(targets,kind,title,body,go){if(Store.demo||!sb||!Store.cloud||!TEAM)return;
 sb.functions.invoke("notify",{body:{team_id:TEAM.id,targets,kind,title,body,url:`/?t=${TEAM.id}&go=${go}`}}).catch(e=>console.warn(e))}
{const _st=A.saveTask;A.saveTask=el=>{if(!TEAM||!teamAg())return _st(el);const before={};vals(S.tasks.items).forEach(t=>before[t.id]=t.who||"");_st(el);
 setTimeout(()=>{vals(S.tasks.items).forEach(t=>{if(t.who&&t.who!==ME.uid&&before[t.id]!==t.who&&t.status!=="done"){const pj=t.proj&&PJ().items[t.proj];
  teamNotify([t.who],pj?"proj":"task",`${TEAM.name}: ${pj?"etapa":"tarefa"} para você`,`${myNick()} colocou você em "${t.title}"${pj?` (projeto ${pj.name})`:""}${t.date?` · até ${ddmm(t.date)}`:""}`,pj?"proj":"tasks")}})},0)}}
{const _cs=A.chalCheckSave;A.chalCheckSave=async el=>{const c=CHP().items[UI.chalOpen];const d=UI.chDay||today();const had=!!(c&&((c.checkins||{})[ME.uid]||{})[d]);await _cs(el);
 const ck=c&&((c.checkins||{})[ME.uid]||{})[d];if(!had&&ck)teamNotify("all","chal",`${TEAM.name} · ${c.name}`,`${myNick()} fez check-in${ck.note?`: ${ck.note}`:""}${ck.photo||ck.photoData?" 📸":""}`,"chal")}}
{const _ce=A.chalEditSave;A.chalEditSave=async el=>{const c=CHP().items[UI.chalOpen];const d=UI.chEdit;const b=c&&((c.checkins||{})[ME.uid]||{})[d];const hadPh=!!(b&&(b.photo||b.photoData)),hadNote=!!(b&&b.note&&!b.auto);await _ce(el);
 const a=c&&((c.checkins||{})[ME.uid]||{})[d];if(a&&((!hadPh&&(a.photo||a.photoData))||(!hadNote&&a.note&&a.edited)))teamNotify("all","chal",`${TEAM.name} · ${c.name}`,`${myNick()} ${!hadPh&&(a.photo||a.photoData)?"postou uma foto":"comentou"} no check-in${a.note?`: ${a.note}`:""}`,"chal")}}
{const _cv=A.chalSave;A.chalSave=el=>{const isNew=!el.dataset.v;const n0=Object.keys(CHP().items).length;_cv(el);if(isNew&&Object.keys(CHP().items).length>n0){const c=CHP().items[UI.chalOpen];if(c)teamNotify("all","chal",`${TEAM.name}: novo desafio`,`${myNick()} criou o desafio "${c.name}". Bora participar?`,"chal")}}}

/* ao sair da conta, este aparelho para de receber os avisos dela */
{const _so=A.signOut;A.signOut=async()=>{try{if(pushOK()&&sb){const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await sb.from("push_subs").delete().eq("endpoint",sub.endpoint);await sub.unsubscribe()}}}catch(e){}return _so()}}

/* início */
(function boot(){
 const l=lsGet();if(l&&l.S){S=hydrate(l.S);Object.assign(PFIN,l.PFIN||{})}
 applyTheme();UI.booted=true;render();
 connectCloud().then(()=>{applyTheme();render()});
 setInterval(checkReminders,20000);setTimeout(checkReminders,1500);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(S.study.timer)tickTimer();checkReminders();if(S.study.timer&&!S.study.timer.paused)requestWake()}});
})();
</script>
