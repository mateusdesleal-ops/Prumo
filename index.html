<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Prumo: Vida em ordem. Organize o dinheiro, os estudos, a saúde e a agenda.">
<meta name="theme-color" content="#FBF6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171114" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prumo">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prumo: Vida em ordem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de celular numa coluna de até 560px, barra de abas fixa embaixo, telas em cartões leves */
:root{
  --bg:#FBF6F7; --surface:#FFFFFF; --surface2:#F5ECEF; --line:#EADCE1;
  --ink:#2B1E24; --muted:#7A6670;
  --pig:#F28AA8; --pig-deep:#D9577E; --pig-soft:#FCD9E3;
  --money:#0E6B57; --money-soft:#D6EFE7;
  --good:#1E8A5A; --warn:#C98A12; --bad:#C8433B;
  --need:#3C6FD1; --want:#D9577E; --future:#0E6B57; --debt:#C8433B;
  --sky:#CFE8F6; --sky2:#EAF5FB; --ground:#B9895A; --grass:#7CC36A; --grass2:#5FA950;
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(80,30,50,.06),0 6px 18px rgba(80,30,50,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171114; --surface:#221A1E; --surface2:#2C2227; --line:#3A2D33;
  --ink:#F6EDF0; --muted:#B49FA8;
  --pig:#F49AB4; --pig-deep:#F07399; --pig-soft:#4A2A35;
  --money:#4FC9A5; --money-soft:#17372F;
  --good:#4CC38A; --warn:#E6B04A; --bad:#F07068;
  --need:#7EA4F0; --want:#F07399; --future:#4FC9A5; --debt:#F07068;
  --sky:#1C2846; --sky2:#2A3A60; --ground:#5B4330; --grass:#3E7A3A; --grass2:#2F6330;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171114; --surface:#221A1E; --surface2:#2C2227; --line:#3A2D33;
  --ink:#F6EDF0; --muted:#B49FA8;
  --pig:#F49AB4; --pig-deep:#F07399; --pig-soft:#4A2A35;
  --money:#4FC9A5; --money-soft:#17372F;
  --good:#4CC38A; --warn:#E6B04A; --bad:#F07068;
  --need:#7EA4F0; --want:#F07399; --future:#4FC9A5; --debt:#F07068;
  --sky:#1C2846; --sky2:#2A3A60; --ground:#5B4330; --grass:#3E7A3A; --grass2:#2F6330;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.1px}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;background:var(--surface2);border-color:transparent}
.section{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.big{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--pig-deep);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.money{background:var(--money);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--pig);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{border:0;background:var(--surface2);border-radius:12px;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.info{background:var(--surface2);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:44px}
textarea{min-height:80px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;min-height:0;flex:none;margin-top:2px;accent-color:var(--pig-deep)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--pig-deep);display:flex;align-items:center;gap:8px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.streak svg{width:16px;height:16px;color:var(--warn)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--pig-deep)}
.subtabs{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none}
.subtabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.subtabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* pig */
.pigstage{border-radius:var(--r);overflow:hidden;background:var(--sky);position:relative}
.pigstage svg{display:block;width:100%;height:auto}
.pig-breathe{transform-origin:160px 205px;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
.pig-bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pig-eyes,.pig-ear,.pig-tail,.tear,.pig-coin,.pig-heart,.leg{transform-box:fill-box}
.pig-eyes{transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.pig-ear{transform-origin:50% 100%;animation:ear 4s ease-in-out infinite}
.pig-ear.r{animation-delay:.5s}
@keyframes ear{0%,78%,100%{transform:rotate(0)}84%{transform:rotate(-12deg)}90%{transform:rotate(7deg)}}
.pig-tail{transform-origin:0% 60%;animation:tail .8s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.m-feliz .pig-bob{animation:hop 3.4s ease-in-out infinite}
@keyframes hop{0%,66%,100%{transform:translateY(0)}74%{transform:translateY(-14px)}82%{transform:translateY(0)}87%{transform:translateY(-5px)}92%{transform:translateY(0)}}
.m-preocupado .pig-bob{animation:sway 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.m-triste .pig-breathe{animation-duration:6s}
.m-triste .pig-tail,.m-preocupado .pig-tail{animation-duration:2.4s}
.m-triste .pig-tail{animation:none}
.tear{animation:tear 2.6s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pig-coin{transform-origin:center;animation:coin 3s ease-in-out infinite}
.pig-coin.b{animation-delay:1.2s}
@keyframes coin{0%,100%{transform:translateY(0) scaleX(1)}25%{transform:translateY(-6px) scaleX(.2)}50%{transform:translateY(-10px) scaleX(1)}75%{transform:translateY(-6px) scaleX(.2)}}
.walking .pig-walk{animation:walk 12s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateX(0)}25%{transform:translateX(34px)}75%{transform:translateX(-34px)}}
.walking .leg.a{animation:step .45s ease-in-out infinite alternate}
.walking .leg.b{animation:step .45s ease-in-out infinite alternate-reverse}
@keyframes step{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.pig-heart{opacity:0;transform-origin:center}
.poke .pig-heart{animation:heart .9s ease-out}
@keyframes heart{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-36px) scale(1.2)}}
.poke .pig-breathe{animation:poke .55s ease-out}
@keyframes poke{0%{transform:scale(1,1)}25%{transform:scale(1.08,.9)}55%{transform:scale(.94,1.08) translateY(-10px)}100%{transform:scale(1,1)}}
.pigstage[data-act]{cursor:pointer}
.wd-ov{position:absolute;inset:0;pointer-events:none;z-index:2}
.pig-wdsad,.pig-wdhappy{display:none}
.pig-look{transition:transform .5s ease}
.wd-look .pig-look{transform:translateX(7px)}
.wd-sad .pig-wdsad{display:inline}.wd-sad .pig-mouth{display:none}
.wd-happy .pig-wdhappy{display:inline}.wd-happy .pig-mouth{display:none}
.wd-sad .pig-ear{transform:rotate(18deg)!important;transition:transform .4s}
.wd-tear{animation:tear 1.6s ease-in infinite}
.wd-bubble{transform-box:fill-box;transform-origin:center bottom;animation:wdBub linear both}
@keyframes wdBub{0%,18%{opacity:0;transform:scale(.6)}26%,78%{opacity:1;transform:scale(1)}88%,100%{opacity:0;transform:scale(.9)}}
.wd-hanger{transform-box:fill-box;transform-origin:center top;animation:wdSwing 1.2s ease-in-out infinite alternate}
.wd-hanger.b{animation-delay:.4s}
@keyframes wdSwing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.wd-ov svg{display:block;width:100%;height:100%}
.wd{transform-box:fill-box;transform-origin:center bottom;animation:wdIn linear both}
@keyframes wdIn{0%{opacity:0;transform:scale(.6)}10%{opacity:1;transform:scale(1)}86%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
.wd-dl,.wd-dr{transform-box:fill-box;animation:wdDoor linear both}
.wd-dl{transform-origin:left center}.wd-dr{transform-origin:right center}
@keyframes wdDoor{0%,14%{transform:scaleX(1)}24%,70%{transform:scaleX(.12)}80%,100%{transform:scaleX(1)}}
.wd-fly{animation:wdFly .95s ease-in-out both}
@keyframes wdFly{0%{transform:translate(var(--sx),var(--sy)) scale(1);opacity:1}55%{opacity:1}100%{transform:translate(var(--ex),var(--ey)) scale(var(--es));opacity:var(--eo)}}
.kanban{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.kcol{flex:0 0 min(86%,320px);scroll-snap-align:start;background:var(--surface2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:220px;min-width:0}
.kcol.over{outline:2px dashed var(--pig);outline-offset:-2px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcard[draggable="true"]{cursor:grab}
.kcard.kdone b{text-decoration:line-through;color:var(--muted)}
.ktitle{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.ktitle b{overflow-wrap:anywhere}
.dvfly{animation:dvF 180s linear infinite;transform:translate(-300px,40px)}
.dvroll{transform-box:fill-box;transform-origin:center;animation:dvRoll 180s linear infinite}
@keyframes dvRoll{0%,81.389%{transform:rotate(0)}83.333%{transform:rotate(-360deg)}83.339%,100%{transform:rotate(0)}}
.dvperch{opacity:0;animation:dvPerch 180s linear infinite}@keyframes dvPerch{0%,55.556%{opacity:0}55.611%,63.833%{opacity:1}63.889%,100%{opacity:0}}
.dvturn{transform-box:fill-box;transform-origin:center;animation:dvTurn 180s steps(1,end) infinite}
@keyframes dvTurn{0%{transform:scaleX(1)}25.556%{transform:scaleX(-1)}30%{transform:scaleX(1)}30.889%{transform:scaleX(-1)}32.778%{transform:scaleX(1)}47.778%{transform:scaleX(-1)}69.444%{transform:scaleX(1)}}
.dvbob{animation:bob 2.2s ease-in-out infinite}
.dvwing{transform-box:fill-box;transform-origin:25% 100%;animation:dvFlap .32s ease-in-out infinite}
@keyframes dvFlap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.45)}}
.dvheart{opacity:0;transform-box:fill-box;transform-origin:center;animation:dvHeart 180s ease-out infinite}
@keyframes dvHeart{0%,56.889%{opacity:0;transform:translateY(0) scale(.4)}57.444%{opacity:1;transform:translateY(-5px) scale(1)}59.167%{opacity:1;transform:translateY(-14px) scale(1)}60%,100%{opacity:0;transform:translateY(-20px) scale(.8)}}
.dvkiss{opacity:0;transform-box:fill-box;transform-origin:center;animation:dvKiss 180s ease-out infinite}.dvkiss.b{animation-name:dvKiss2}
@keyframes dvKiss{0%,31.222%{opacity:0;transform:translateY(0) scale(.3)}31.556%{opacity:1;transform:translateY(-6px) scale(1)}32.222%{opacity:1;transform:translateY(-16px) scale(1)}32.667%,100%{opacity:0;transform:translateY(-22px) scale(.7)}}
@keyframes dvKiss2{0%,31.611%{opacity:0;transform:translate(0,0) scale(.3)}31.944%{opacity:1;transform:translate(-6px,-6px) scale(.8)}32.444%{opacity:1;transform:translate(-10px,-15px) scale(.8)}32.889%,100%{opacity:0;transform:translate(-12px,-20px) scale(.6)}}
.dvground{opacity:0;animation:dvGround 180s linear infinite}@keyframes dvGround{0%,13.333%{opacity:0}13.389%,23.278%{opacity:1}23.333%,100%{opacity:0}}
.dvgwalk{transform:translate(268px,233px);animation:dvGWalk 180s ease-in-out infinite}
@keyframes dvGWalk{0%,13.333%{transform:translate(268px,233px)}15.278%{transform:translate(288px,233px)}17.222%{transform:translate(288px,233px)}19.167%{transform:translate(256px,233px)}20.556%{transform:translate(256px,233px)}22.222%,100%{transform:translate(268px,233px)}}
.dvgstep{animation:dvStep .42s ease-in-out infinite alternate}@keyframes dvStep{from{transform:translateY(0)}to{transform:translateY(-1.2px)}}
.dvghead{transform-box:fill-box;transform-origin:50% 100%;animation:dvLook 180s ease-in-out infinite}
@keyframes dvLook{0%,13.889%{transform:none}14.167%{transform:rotate(-14deg)}14.722%{transform:rotate(12deg)}15.278%,17.333%{transform:none}17.556%{transform:translateY(5px)}17.833%{transform:none}18.111%{transform:translateY(5px)}18.389%,21.111%{transform:none}21.389%{transform:rotate(10deg)}21.944%,100%{transform:none}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
.twinkle.b{animation-delay:.9s}.twinkle.c{animation-delay:1.7s}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
.glow{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.6}}
.dvfly,.dvroll,.dvturn,.dvperch,.dvheart,.dvkiss,.dvground,.dvgwalk,.dvghead,.walking .pig-walk{animation-delay:var(--dvd,0s)}
@media (prefers-reduced-motion: reduce){.dvfly,.dvroll,.dvturn,.dvbob,.dvfold,.dvwing,.dvheart,.dvkiss,.dvperch,.dvground,.dvgwalk,.dvgstep,.dvghead,.twinkle,.glow{animation:none!important}.dvperch,.dvground,.dvkiss{display:none}.dvfly{transform:translate(22px,14px)!important}}
.tfull{display:none}
@media (orientation: landscape) and (max-height: 600px){
 .tfull:not([hidden]){display:flex;position:fixed;inset:0;z-index:55;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(12px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
 .tfull .tf-clock{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;font-size:min(34vh,22vw);line-height:.95;letter-spacing:-.02em}
 .tfull .tf-bar{width:min(70vw,640px);height:10px;border-radius:9px;background:var(--surface2);overflow:hidden}
 .tfull .tf-bar i{display:block;height:100%;background:var(--pig-deep);border-radius:9px;transition:width 1s linear}
 .tfull .row .btn{min-width:130px}
 body:has(.tfull:not([hidden])) .tabs,body:has(.tfull:not([hidden])) .fab{display:none}
}
@media (prefers-reduced-motion: reduce){.pig-breathe,.pig-bob,.spin,.pig-eyes,.pig-ear,.pig-tail,.tear,.pig-coin,.pig-walk,.leg,.pig-heart{animation:none!important}}
.meter{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:999px;background:var(--pig-deep);transition:width .4s}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .grow p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;font-size:15px}
.amount{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--ink)} .pos{color:var(--good)}
.empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:14px}

/* bars */
.bucket{display:flex;flex-direction:column;gap:6px}
.btrack{position:relative;height:14px;border-radius:999px;background:var(--surface2);overflow:hidden}
.btrack i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.btrack b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}

/* fab */

function personalS(){if(!PERS||PERS.S!==S)return S;let o=S;TPARTS.forEach(p=>p.keys.forEach(k=>{if(TOBJ.has(S[k])){if(o===S)o=Object.assign({},S);if(PERS[k])o[k]=PERS[k];else delete o[k]}}));return o}

function markActive(day){S.activity[day||today()]=1}
function streak(){let n=0;let d=today();if(!S.activity[d])d=addDays(d,-1);let lastGrace=null;
 for(let guard=0;guard<4000;guard++){if(S.activity[d]){n++;d=addDays(d,-1);continue}const prev=addDays(d,-1);
  if(n>0&&S.activity[prev]&&(!lastGrace||(parseDate(lastGrace)-parseDate(d))/86400000>=7)){lastGrace=d;d=prev;continue}break}return n}
function bestStreak(){const days=Object.keys(S.activity).sort();let best=0,cur=0,prev=null;for(const d of days){cur=(prev&&addDays(prev,1)===d)?cur+1:1;best=Math.max(best,cur);prev=d}return Math.max(best,streak())}

function monthData(k){const m=finDocs()["m"+k.replace("-","")]||{};return{incomes:Object.entries(m.incomes||{}).filter(([,v])=>v).map(([id,v])=>({id,...v})),expenses:Object.entries(m.expenses||{}).filter(([,v])=>v).map(([id,v])=>({id,...v}))}}
const mid=k=>"m"+k.replace("-","");
function meta(){return finDocs().meta||{}}
function allMonths(){return Object.keys(finDocs()).filter(k=>/^m\d{6}$/.test(k)).map(k=>k.slice(1,5)+"-"+k.slice(5)).sort()}
function filterBy(arr){if(finScope()==="p"||UI.filter==="all")return arr;return arr.filter(x=>UI.filter==="me"?x.by===ME.uid:x.by!==ME.uid)}
function sum(a){return a.reduce((s,x)=>s+(+x.v||0),0)}
function totals(k,useFilter){const {incomes,expenses}=monthData(k);const inc=useFilter?filterBy(incomes):incomes;const exp=useFilter?filterBy(expenses):expenses;
 const b={N:0,D:0,F:0};for(const e of exp){const c=CAT[e.cat]||CAT.outros;b[c.b]+=+e.v||0}
 return{income:sum(inc),spent:sum(exp),b,incomes:inc,expenses:exp}}
function debtPaidBy(id){const o={};for(const k of allMonths())for(const e of monthData(k).expenses)if(e.cat==="divida"&&e.debtId===id){const u=e.by||"";o[u]=(o[u]||0)+(+e.v||0)}return o}
function vqRows(d){const sp=d.split||{};const pb=debtPaidBy(d.id);return Object.entries(sp).filter(([,v])=>v!=null).map(([u,v])=>({u,share:+v||0,paid:pb[u]||0}))}
function cowPig(px){return `<span style="display:inline-block;width:${px}px;height:${px}px;flex:none" aria-hidden="true">${pigSVG({score:75,mood:"feliz",equip:{},env:0,mini:true,cow:true}).replace(/viewBox="[^"]*"/,'viewBox="62 48 196 196"')}</span>`}
function debts(){const m=meta();const ds=Object.entries(m.debts||{}).filter(([,v])=>v).map(([id,v])=>({id,...v}));
 const paid={};for(const k of allMonths())for(const e of monthData(k).expenses)if(e.cat==="divida"&&e.debtId)paid[e.debtId]=(paid[e.debtId]||0)+(+e.v||0);

function occursOn(ev,day){if(ev.date===day)return true;if(!ev.repeat||ev.repeat==="none"||day<ev.date)return false;
 const a=parseDate(ev.date),b=parseDate(day);
 if(ev.repeat==="daily")return true;
 if(ev.repeat==="weekly")return a.getDay()===b.getDay();
 if(ev.repeat==="monthly")return a.getDate()===b.getDate();
 if(ev.repeat==="yearly")return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();return false}
const eventsOn=day=>[...vals(S.agenda.events).filter(e=>occursOn(e,day)),...taskEvents(day)].sort((a,b)=>(a.time||"").localeCompare(b.time||""));
function upcoming(n){const out=[];for(let i=0;i<14&&out.length<n;i++){const d=addDays(today(),i);for(const e of eventsOn(d)){if(i===0&&e.time){const now=new Date();const [h,m]=e.time.split(":").map(Number);if(h*60+m<now.getHours()*60+now.getMinutes()-30)continue}out.push({...e,day:d})}}return out.slice(0,n)}
const notified=new Set();
function checkReminders(){checkWater();const now=new Date();
 for(const d of [today(),addDays(today(),1)])for(const e of [...eventsOn(d),...(TEAM&&PERS&&PERS.S===S?withPersonal(()=>eventsOn(d)):[])]){if(!e.time)continue;const [h,m]=e.time.split(":").map(Number);const at=parseDate(d);at.setHours(h,m,0,0);const rem=new Date(at.getTime()-(+e.remind||0)*60000);const key=e.id+d;
  if(now>=rem&&now<=new Date(at.getTime()+5*60000)&&!notified.has(key)){notified.add(key);beep();toast(`${e.title} ${e.remind>0?"em "+e.remind+" min":"agora"} (${e.time})`,8000);notify(e.title,(e.remind>0?"Em "+e.remind+" min · ":"Agora · ")+e.time)}}
}
function icsFor(list){const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Prumo//PT-BR","CALSCALE:GREGORIAN"];
 const f=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
 const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
 for(const e of list){lines.push("BEGIN:VEVENT","UID:"+e.id+"@prumo","DTSTAMP:"+f(new Date()));
  if(e.time){const s=parseDate(e.date);const [h,m]=e.time.split(":").map(Number);s.setHours(h,m,0,0);const en=new Date(s.getTime()+(+e.dur||60)*60000);lines.push("DTSTART:"+f(s),"DTEND:"+f(en))}
  else{lines.push("DTSTART;VALUE=DATE:"+e.date.replace(/-/g,""),"DTEND;VALUE=DATE:"+addDays(e.date,1).replace(/-/g,""))}
  lines.push("SUMMARY:"+icsEsc(e.title));if(e.place)lines.push("LOCATION:"+icsEsc(e.place));if(e.notes)lines.push("DESCRIPTION:"+icsEsc(e.notes));
  const rr={daily:"DAILY",weekly:"WEEKLY",monthly:"MONTHLY",yearly:"YEARLY"}[e.repeat];if(rr)lines.push("RRULE:FREQ="+rr);
  lines.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(e.title),"TRIGGER:-PT"+(+e.remind||0)+"M","END:VALARM","END:VEVENT")}
 lines.push("END:VCALENDAR");return lines.join("\r\n")}

let OINC_BUF=null,OINC_LOAD=null;
function oinc(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
 const play=()=>{const src=AC.createBufferSource();src.buffer=OINC_BUF;const g=AC.createGain();g.gain.value=.8;src.connect(g).connect(AC.destination);src.start()};
 if(OINC_BUF){play();return}
 if(!OINC_LOAD){const bin=atob(OINC_SRC.split(",")[1]);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  OINC_LOAD=new Promise((ok,no)=>AC.decodeAudioData(u8.buffer,ok,no)).then(b=>{OINC_BUF=b;return b})}
 OINC_LOAD.then(play).catch(()=>{try{const a=new Audio(OINC_SRC);a.volume=.8;a.play()}catch(e){}})}catch(e){}}
function beep(){if(S.profile.oinc!==false){oinc();return}try{if(!AC)return;const t=AC.currentTime;[0,.22,.44].forEach((o,i)=>{const g=AC.createGain(),os=AC.createOscillator();os.frequency.value=[660,880,990][i];os.type="sine";g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.001,t+o+.2);os.connect(g).connect(AC.destination);os.start(t+o);os.stop(t+o+.22)})}catch(e){}}
function oink(){try{unlockAudio();if(!AC)return;const t=AC.currentTime;[0,.16].forEach(o=>{const os=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();os.type="sawtooth";os.frequency.setValueAtTime(320,t+o);os.frequency.exponentialRampToValueAtTime(170,t+o+.13);f.type="lowpass";f.frequency.value=900;g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.18,t+o+.02);g.gain.exponentialRampToValueAtTime(.001,t+o+.14);os.connect(f).connect(g).connect(AC.destination);os.start(t+o);os.stop(t+o+.15)})}catch(e){}}

function unSing(w){if(/ões$/.test(w))return w.replace(/ões$/,"ão");if(/(r|z|l)es$/.test(w))return w.slice(0,-2);if(/s$/.test(w)&&w.length>3)return w.slice(0,-1);return w}

 if(N!==1)out.push({k:"p",per:1,one:"porção",many:"porções",step:.5,hint:por});
 if(!/^porç/.test(noun))out.push({k:"u",per:N,one:fm.one,many:fm.many,step:N>=2?1:.5});else if(N===1)out.push({k:"p",per:1,one:"porção",many:"porções",step:.5});

function payoff(B,ratePct,P){const r=(+ratePct||0)/100;if(!P||P<=0)return null;if(r>0&&P<=B*r)return{never:true};let b=B,m=0,int=0;while(b>0.005&&m<600){const j=b*r;int+=j;b=b+j-P;m++}if(m>=600)return{never:true};return{months:m,interest:Math.max(0,int)}}
const monthsLabel=m=>m<12?`${m} ${m===1?"mês":"meses"}`:`${Math.floor(m/12)} ${Math.floor(m/12)===1?"ano":"anos"}${m%12?` e ${m%12} ${m%12===1?"mês":"meses"}`:""}`;
const endDate=m=>{const d=new Date();d.setMonth(d.getMonth()+m);return MONTHS[d.getMonth()]+" de "+d.getFullYear()};
function simulateAll(ds,budget,strategy){const items=ds.filter(d=>d.left>0).map(d=>({id:d.id,name:d.name,b:d.left,r:(+d.rate||0)/100,min:Math.min(+d.min||0,d.left),done:null}));
 const sumMin=items.reduce((s,x)=>s+x.min,0);if(!items.length)return{items,months:0,interest:0,ok:true,sumMin};if(budget<sumMin-0.5)return{items,ok:false,sumMin};
 let m=0,interest=0;while(items.some(x=>x.b>0.005)&&m<600){m++;items.forEach(x=>{if(x.b>0.005){const j=x.b*x.r;interest+=j;x.b+=j}});
  let cash=budget;items.forEach(x=>{if(x.b>0.005){const p=Math.min(x.min,x.b);x.b-=p;cash-=p}});
  const order=items.filter(x=>x.b>0.005).sort((a,b)=>strategy==="bola"?a.b-b.b:b.r-a.r||a.b-b.b);
  for(const x of order){if(cash<=0)break;const p=Math.min(cash,x.b);x.b-=p;cash-=p}
  items.forEach(x=>{if(x.b<=0.005&&x.done===null)x.done=m})}
 return{items:items.sort((a,b)=>(a.done||999)-(b.done||999)),months:m,interest,ok:m<600,sumMin}}
function debtBudgetSuggestion(ds){const inc=refIncome(mkey());const sumMin=ds.filter(d=>d.left>0).reduce((s,d)=>s+Math.min(+d.min||0,d.left),0);const plan=planFor(inc);return Math.ceil(Math.max(sumMin,sumMin+inc*plan.F/100*0.8))}

function spendProfile(){const cur=mkey();const prev=[1,2,3].map(i=>shiftMonth(cur,-i)).filter(k=>totals(k,false).spent>0);const inc=refIncome(cur);const plan=planFor(inc);
 if(prev.length){const t=prev.map(k=>totals(k,false));const avg=f=>t.reduce((s,x)=>s+f(x),0)/t.length;return{inc,plan,N:avg(x=>x.b.N),D:avg(x=>x.b.D),est:false,months:prev.length}}
 const c=totals(cur,false);const d=parseDate(today());const prog=Math.max(.25,d.getDate()/new Date(d.getFullYear(),d.getMonth()+1,0).getDate());
 if(c.spent>0)return{inc,plan,N:Math.max(c.b.N/prog,c.b.N),D:Math.max(c.b.D/prog,c.b.D),est:true,months:0};
 return{inc,plan,N:inc*plan.N/100,D:inc*plan.D/100,est:true,months:0}}
function analyzePurchase(q){const sp=spendProfile();const inc=sp.inc;const plan=sp.plan;const R=[];
 const price=q.price,n=q.mode==="parcelado"?Math.max(1,q.n):1,parc=q.mode==="parcelado"?(q.parc||price/n):price,total=q.mode==="parcelado"?parc*n:price,extra=Math.max(0,total-price);
 const open=debts().filter(d=>d.left>0);const sumMin=open.reduce((s,d)=>s+Math.min(+d.min||0,d.left),0);
 const margin=inc-sp.N-sp.D-sumMin;const dLimit=inc*plan.D/100;const dLeftMonth=Math.max(0,dLimit-totals(mkey(),false).b.D);
 const reserve=reserveNow();const j=journey();const expensive=hasExpensiveDebt();const desejo=q.kind==="D";
 if(!inc){return{verdict:"sem",reasons:[{k:"warn",t:"Lance sua renda para o Prumo conseguir analisar."}],price,total,parc,n,extra}}
 if(q.mode==="parcelado"){const pct=parc/inc;const comp=(sumMin+parc)/inc;
  if(comp>0.3)R.push({k:"bad",t:`Com esta parcela, suas parcelas mensais somariam ${brl0(sumMin+parc)}, ${Math.round(comp*100)}% da renda. O limite saudável é 30%.`});
  else R.push({k:comp>0.2?"warn":"good",t:`Somando com o que você já paga, as parcelas ficam em ${Math.round(comp*100)}% da renda${comp>0.2?", perto do limite de 30%":", dentro do limite de 30%"}.`});
  if(parc>margin)R.push({k:"bad",t:`Pela média dos seus gastos, sobram cerca de ${brl0(Math.max(0,margin))} por mês. A parcela de ${brl0(parc)} não cabe.`});
  else R.push({k:"good",t:`A parcela de ${brl0(parc)} cabe no que costuma sobrar por mês (cerca de ${brl0(margin)}).`});
  if(desejo&&parc>dLimit*0.5)R.push({k:"warn",t:`A parcela ocupa ${Math.round(parc/dLimit*100)}% do seu limite de desejos (${brl0(dLimit)} por mês) durante ${n} meses.`});
  if(extra>0.5){const rate=implicitRate(price,parc,n);R.push({k:extra/price>0.1?"warn":"good",t:`O parcelamento custa ${brl0(extra)} a mais que à vista (${Math.round(extra/price*100)}%)${rate?`, como juros de cerca de ${rate.toLocaleString("pt-BR",{maximumFractionDigits:1})}% ao mês`:""}.`})}
  if(n>10)R.push({k:"warn",t:`São ${n} parcelas: você vai pagar esta compra até ${endDate(n)}.`})}
 else{if(desejo&&price>dLeftMonth)R.push({k:price>dLeftMonth+Math.max(0,margin)?"bad":"warn",t:`Restam ${brl0(dLeftMonth)} de desejos neste mês. A compra passa ${brl0(price-dLeftMonth)} do limite.`});
  else if(desejo)R.push({k:"good",t:`Cabe nos desejos deste mês: restam ${brl0(dLeftMonth)}.`});
  if(!desejo&&price>Math.max(0,margin)+dLeftMonth&&price>reserve)R.push({k:"bad",t:"O valor é maior do que sobra no mês e do que você tem na reserva."});
  if(price>Math.max(0,margin)&&reserve>0&&desejo)R.push({k:"warn",t:"Se precisar mexer na reserva de emergência para isso, não compre: a reserva é só para emergências."})}
 if(expensive&&desejo)R.push({k:"bad",t:"Você tem dívida com juros altos. Enquanto ela existir, cada real em desejo grande custa caro: o melhor uso do dinheiro é quitá-la."});
 if(reserve<j.mini&&desejo)R.push({k:"warn",t:`Sua reserva ainda não chegou à mini-reserva de ${brl0(j.mini)}. Um imprevisto agora viraria dívida.`});
 if(desejo&&price>=(+S.profile.limit48||100))R.push({k:"info",t:"Regra das 48 horas: espere dois dias antes de decidir. Se ainda quiser, a vontade é real."});
 if(!desejo)R.push({k:"info",t:"Por ser uma necessidade, vale pesquisar preço e comparar à vista com parcelado sem juros."});
 if(sp.est)R.push({k:"info",t:sp.months?"":"Análise feita com a sua renda e o plano do Prumo, porque ainda há poucos gastos lançados. Quanto mais você registrar, mais precisa ela fica."});
 const bad=R.some(x=>x.k==="bad"),warn=R.some(x=>x.k==="warn");const verdict=bad?"esperar":warn?"cuidado":"pode";
 const save=Math.max(50,Math.round(Math.max(dLimit*0.4,Math.min(Math.max(margin,0),dLimit))/10)*10);const mSave=Math.ceil(price/save);
 return{verdict,reasons:R.filter(x=>x.t),price,total,parc,n,extra,save,mSave}}
function implicitRate(pv,pmt,n){if(pmt*n<=pv+0.5||n<2)return 0;let lo=0,hi=1;for(let i=0;i<60;i++){const r=(lo+hi)/2;const v=pmt*(1-Math.pow(1+r,-n))/r;if(v>pv)lo=r;else hi=r}return Math.round((lo+hi)/2*1000)/10}

const toMin=t=>{const [h,m]=String(t||"0:0").split(":").map(Number);return h*60+(m||0)};
const fromMin=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
function waterCfg(){return Object.assign({on:false,from:"08:00",to:"22:00",every:null},S.food.cfg.waterRem||{})}
function waterSuggest(c){c=c||waterCfg();const win=Math.max(60,toMin(c.to)-toMin(c.from));const g=waterGoal();return clamp(Math.round(win/Math.max(1,g-1)/15)*15,30,180)}
function waterSlots(){const c=waterCfg();if(!c.on)return[];const ev=+c.every||waterSuggest(c);const out=[];for(let t=toMin(c.from);t<=toMin(c.to);t+=ev)out.push(t);return out}
const durLabel=m=>m<60?`${m} min`:`${Math.floor(m/60)}h${m%60?pad(m%60):""}`;
function waterRemView(){const c=waterCfg();const sug=waterSuggest(c);const ev=+c.every||sug;
 openModal("Lembrete de água",`<div class="stack">
 <label class="check card flat"><input type="checkbox" id="wr_on" ${c.on?"checked":""}><span><b>Me lembrar de beber água</b></span></label>
 <div class="grid2"><label class="field"><span>Começar às</span><input id="wr_from" type="time" value="${c.from}"></label><label class="field"><span>Parar às</span><input id="wr_to" type="time" value="${c.to}"></label></div>
 <div class="banner info" id="wr_sug"></div>
 <div class="field"><span>Lembrar a cada</span><div class="chips" style="flex-wrap:wrap">${[30,45,60,90,120].map(m=>`<button class="chip ${ev===m?"on":""}" data-act="wrEvery" data-v="${m}">${durLabel(m)}</button>`).join("")}<button class="chip" data-act="wrEvery" data-v="sug">Usar sugestão</button></div>
  <input id="wr_every" type="number" inputmode="numeric" min="15" max="300" step="5" value="${ev}"><span class="tiny muted">Em minutos. Você pode digitar qualquer intervalo.</span></div>
 <p class="tiny muted" id="wr_count"></p>
 <button class="btn block" data-act="saveWaterRem">Salvar</button></div>`,()=>{const upd=()=>{const tmp={from:v("wr_from"),to:v("wr_to")};const s=waterSuggest(tmp);const g=waterGoal();const e=+v("wr_every")||s;
  $("#wr_sug").innerHTML=`<span>Sua meta é de ${g} copos de 250 ml por dia. Entre ${tmp.from} e ${tmp.to}, o Prumo sugere <b>1 copo a cada ${durLabel(s)}</b>.</span>`;
  const n=Math.floor((toMin(tmp.to)-toMin(tmp.from))/e)+1;$("#wr_count").textContent=n>0?`Com esse intervalo, serão ${n} lembretes por dia.`:"";
  document.querySelectorAll('[data-act="wrEvery"]').forEach(b=>b.classList.toggle("on",+b.dataset.v===e))};
  ["wr_from","wr_to","wr_every"].forEach(id=>$("#"+id).addEventListener("input",upd));upd()})}
function checkWater(){const c=waterCfg();if(!c.on)return;const now=new Date();const nm=now.getHours()*60+now.getMinutes();const d=today();
 for(const t of waterSlots()){const key="w"+d+t;if(nm>=t&&nm<=t+4&&!notified.has(key)){notified.add(key);const done=+S.food.water[d]||0,g=waterGoal();beep();toast(`Hora de beber água. Você está em ${done} de ${g} copos hoje.`,7000);if(typeof notify==="function")notify("Hora de beber água",`Você está em ${done} de ${g} copos hoje.`)}}}

const TREP=[["","Não repete"],["daily","Todo dia"],["weekdays","Dias úteis (seg. a sex.)"],["weekly","Toda semana"],["monthly","Todo mês"]];
function trepMatch(t,day){if(!t.repeat||!t.date||day<t.date)return day===t.date;const d=parseDate(day),o=parseDate(t.date);
 if(t.repeat==="daily")return true;if(t.repeat==="weekdays")return d.getDay()>0&&d.getDay()<6;if(t.repeat==="weekly")return d.getDay()===o.getDay();
 if(t.repeat==="monthly"){const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(o.getDate(),last)}return day===t.date}
function trepNext(t){let d=t.date||today();const step=x=>{const o=parseDate(t.date||today());if(t.repeat==="monthly"){const c=parseDate(x);const y=c.getFullYear(),m=c.getMonth()+1;const last=new Date(y,m+1,0).getDate();return ymd(new Date(y,m,Math.min(o.getDate(),last)))}let n=addDays(x,1);while(!trepMatch(t,n))n=addDays(n,1);return n};
 d=step(d);while(d<=today()&&(t.date||today())<=today())d=step(d);return d}
function taskEvents(day){return taskList().filter(t=>t.status!=="done"&&t.cal!==false&&(t.date===day||(t.repeat&&trepMatch(t,day)))).map(t=>({id:"task_"+t.id+(t.date===day?"":"_"+day),taskId:t.id,task:true,title:(t.proj&&PJ().items[t.proj]?PJ().items[t.proj].name+" · ":"")+t.title,date:day,time:t.time||"",remind:t.date===day?+t.remind||0:0,repeat:t.repeat==="daily"||t.repeat==="weekdays"?"daily":"none",place:t.place||""}))}

function moveTask(id,to){const t=S.tasks.items[id];if(!t||t.status===to)return;const lb=taskDecay().lost;setTimeout(()=>taskLostToast(lb),0);const prev=t.status;t.status=to;
 if(to==="done"){t.doneAt=Date.now();S.tasks.doneTotal=(+S.tasks.doneTotal||0)+1;markActive();let tot=S.tasks.doneTotal;if(teamAg()&&PERS&&PERS.tasks){PERS.tasks.doneTotal=(+PERS.tasks.doneTotal||0)+1;tot=PERS.tasks.doneTotal;t.doneBy=ME.uid}const r=TASK_REWARDS.find(x=>x.tasks===tot);
  let nx=null;if(t.repeat&&!(t.nextId&&S.tasks.items[t.nextId])){const nid=rid();nx={...clone(t),id:nid,date:trepNext(t),status:"todo",doneAt:null,created:Date.now(),resched:0,reschedLog:[],subs:(t.subs||[]).map(x=>({t:x.t,done:false}))};delete nx.nextId;S.tasks.items[nid]=nx;t.nextId=nid}
  commit();if(r&&S.profile.pet)toast(`Tarefa concluída! O porquinho ganhou: ${r.n.toLowerCase()}. Vista em Guarda-roupa.`,5000);else toast(nx?`Tarefa concluída! A próxima ficou para ${dayLabel(nx.date)}.`:"Tarefa concluída!");
  if(t.kind==="pagar"&&t.value)setTimeout(()=>expenseForm({v:t.value,desc:t.title,cat:"contas"},mkey()),350);return}
 if(prev==="done"){S.tasks.doneTotal=Math.max(0,(+S.tasks.doneTotal||0)-1);t.doneAt=null;const n=t.nextId&&S.tasks.items[t.nextId];if(n&&n.status==="todo"&&!(n.subs||[]).some(x=>x.done))delete S.tasks.items[t.nextId];delete t.nextId}

function macroGoals(){const kc=kcalGoal();const w=+S.profile.weight||0;if(!kc||!w)return null;const g=S.food.cfg.goal;
 const p=Math.round(w*(g==="perder"?1.4:g==="ganhar"?1.6:1.2));const f=Math.round(kc*0.28/9);const c=Math.max(0,Math.round((kc-p*4-f*9)/4));return{kcal:kc,p,c,f,fib:S.food.cfg.sex==="m"?30:25}}
function macroSources(ls,key){const by={};ls.forEach(l=>{const v=(+l[key]||0)*portionsOf(l);if(v>0)by[l.n]=(by[l.n]||0)+v});const tot=Object.values(by).reduce((a,b)=>a+b,0);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];return top?{n:top[0],pct:Math.round(top[1]/tot*100)}:null}

 return pts>=5?{n:"Ótimo",k:"good",t:"Seus alimentos foram, na maior parte, comida de verdade, com frutas e verduras."}:pts>=3?{n:"Bom",k:"good",t:"Boa base de comida de verdade. Dá para incluir mais frutas e verduras."}:pts>=2?{n:"Correto",k:"warn",t:"Seus alimentos foram razoáveis. Trocar um processado por algo natural já melhora."}:{n:"Atenção",k:"bad",t:"Muitos ultraprocessados e poucas frutas e verduras hoje. Amanhã é uma nova chance."}}
function dayAnalysis(d){const fd=foodDay(d);const partial=d===today()&&!fd.ls.some(l=>l.meal==="jantar");const ate=partial?"Até agora, ":"";const mg=macroGoals();const kc=showKcal();const q=qualityRating(fd);const goal=kcalGoal();const parts=[];let title;
 if(!fd.count)return{title:"Nenhuma refeição registrada",text:"Registre o que comeu para ver a análise do dia.",fd,q,mg};
 if(fd.meals<=1)title="Dia com poucos registros";else if(q&&q.k==="good"&&fd.meals>=3)title="Um dia bem estruturado";else if(fd.ultra>=3)title="Dia com muitos ultraprocessados";else title="Um dia razoável";
 if(kc&&goal){const r=fd.kcal/goal;if(r>1.15){parts.push(`Você passou ${Math.round(fd.kcal-goal)} kcal da meta. Acontece: o que conta é a média da semana.`);if(title==="Um dia bem estruturado")title="Dia bom, acima da meta"}else if(r<0.6&&fd.meals>=3)parts.push("Sua ingestão ficou bem abaixo da meta. Comer muito pouco também não ajuda: o corpo cobra depois.");else if(r<=1.15&&r>=0.85)parts.push("Suas calorias ficaram perto da meta.");}
 if(kc&&mg){const pr=fd.p/mg.p;if(pr<0.6&&!partial)parts.push("Faltou proteína: vale incluir ovos, frango, peixe, feijão ou iogurte natural.");else if(pr>=0.9)parts.push("As proteínas estão bem encaminhadas.");if(partial&&pr<0.35)parts.push("Até agora, pouca proteína: na próxima refeição vale incluir ovos, frango, peixe, feijão ou iogurte natural.");if(fd.fib<mg.fib*0.6&&!partial)parts.push("As fibras ficaram baixas: frutas com casca, verduras, feijão e aveia ajudam.")}
 parts.push(fd.fv>=5?"Você bateu as 5 porções de frutas e verduras.":fd.fv>=3?`${ate?"Até agora, foram":"Foram"} ${fd.fv} porções de frutas e verduras, perto das 5 recomendadas.`:fd.fv>0?`${ate||""}${ate?"só":"Só"} ${fd.fv} ${fd.fv===1?"porção":"porções"} de frutas e verduras. Tente uma a mais na próxima refeição.`:`${ate?"Até agora, nenhuma":"Nenhuma"} porção de frutas e verduras. Tente incluir uma na próxima refeição.`);

const foodByName=n=>FOODS.find(f=>f.n===n);
function tplStats(items){let kcal=0,p=0,fib=0,fv=0,ultra=0;items.forEach(([n,q])=>{const f=foodByName(n);if(!f)return;kcal+=f.kcal*q;p+=(f.p||0)*q;fib+=(f.fib||0)*q;if(f.g==="f"||f.g==="v")fv+=q;if(f.nova==="u")ultra++});return{kcal:Math.round(kcal),p:Math.round(p),fib:Math.round(fib),fv,ultra}}
function mealPlan(d){d=d||today();const fd=foodDay(d);const kc=kcalGoal();const goal=kc||2000;const g=S.food.cfg.goal||"manter";
 const cons={};MAIN_MEALS.forEach(m=>cons[m]=Math.round(fd.ls.filter(l=>l.meal===m).reduce((s,l)=>s+(+l.kcal||0)*portionsOf(l),0)));
 const logged=MAIN_MEALS.filter(m=>fd.ls.some(l=>l.meal===m));const extra=Math.round(fd.ls.filter(l=>!MAIN_MEALS.includes(l.meal)).reduce((s,l)=>s+(+l.kcal||0)*portionsOf(l),0));
 const lastIdx=Math.max(-1,...logged.map(m=>MAIN_MEALS.indexOf(m)));const pending=MAIN_MEALS.filter((m,i)=>i>lastIdx&&!logged.includes(m));
 const used=logged.reduce((s,m)=>s+cons[m],0)+extra;const remaining=goal-used;const shareSum=pending.reduce((s,m)=>s+MEAL_SHARE[m],0)||1;
 const target={};pending.forEach(m=>{target[m]=Math.round(clamp(remaining*MEAL_SHARE[m]/shareSum,MEAL_FLOOR[m],goal*MEAL_SHARE[m]*1.4))});
 const reasons=[];
 logged.forEach(m=>{const plan=goal*MEAL_SHARE[m];const nm=MEALS.find(x=>x[0]===m)[1].toLowerCase();if(cons[m]>plan*1.2)reasons.push(`O ${nm} passou do previsto (${cons[m]} de ${Math.round(plan)} kcal), então as próximas refeições ficam um pouco mais leves.`);else if(cons[m]<plan*0.6)reasons.push(`O ${nm} foi leve (${cons[m]} de ${Math.round(plan)} kcal), então dá para reforçar um pouco a próxima.`)});
 const prog=logged.length?(logged.reduce((s,m)=>s+MEAL_SHARE[m],0)):0;const mg=macroGoals();const pTarget=mg?mg.p:Math.round((+S.profile.weight||70)*1.2);
 const proteinGap=logged.length>0&&fd.p<pTarget*prog*0.7;const fvGap=logged.length>0&&fd.fv<Math.max(1,5*prog*0.7);const ultraDay=fd.ultra>0;
 if(proteinGap)reasons.push("Faltou proteína até agora, então as sugestões têm mais proteína.");
 if(fvGap)reasons.push(fd.fv?"Poucas frutas e verduras até agora: as sugestões incluem mais.":"Ainda não teve frutas ou verduras hoje: as sugestões incluem salada ou fruta.");
 if(ultraDay)reasons.push("Teve ultraprocessado hoje, então as sugestões priorizam comida de verdade.");
 if(remaining<goal*0.15&&pending.length)reasons.push("Você já chegou perto da meta do dia. Mesmo assim, não pule refeições: prefira algo leve e nutritivo.");
 return{goal,known:!!kc,g,cons,logged,pending,target,reasons,proteinGap,fvGap,next:pending[0]||null}}
function suggestMeal(m,plan,n){const T=plan.target[m]||Math.round(plan.goal*MEAL_SHARE[m]);
 UI.lastSug=UI.lastSug||{};
 return(MEAL_TPL[m]||[]).map(([name,base])=>{const b0=tplStats(base);const sf=Math.round(clamp(T/Math.max(1,b0.kcal),.75,m==="lanche"?1.5:1.75)*4)/4;
  const items=base.map(([n,q])=>{const f=foodByName(n);const keep=f&&(f.g==="v"||f.g==="f"||/^Café/.test(n)||n==="Azeite");return[n,keep?q:Math.max(.25,Math.round(q*sf*4)/4)]});
  const st=tplStats(items);let sc=Math.abs(st.kcal-T)/T+Math.abs(sf-1)*.08;const heavy=/reforçad/i.test(name);
  if(heavy)sc+=plan.g==="ganhar"?-.1:.6;if(plan.g==="perder"&&st.fv>=1)sc-=.08;UI.lastSug[m+"|"+name]=items;
  if(plan.g==="perder"&&st.kcal>T)sc+=.15;if(plan.g==="ganhar"&&st.kcal<T)sc+=.15;
  if(plan.proteinGap&&st.p<(m==="lanche"?8:20))sc+=.3;if(plan.fvGap&&st.fv<1)sc+=.35;if(st.ultra)sc+=.2;
  const tags=[];if(st.p>=(m==="lanche"?10:25))tags.push("Rico em proteína");if(st.fv>=1)tags.push("Com frutas ou verduras");if(st.fib>=6)tags.push("Rico em fibras");if(st.kcal<T*0.85)tags.push("Leve");
  return{name,items,st,sc,tags,T}}).sort((a,b)=>a.sc-b.sc).slice(0,n||2)}
function suggestionCard(plan,m,opts){const nm=MEALS.find(x=>x[0]===m)[1];const list=suggestMeal(m,plan,opts&&opts.n||2);const kc=showKcal();
 const gLabel={perder:"perder peso",manter:"manter o peso",ganhar:"ganhar peso"}[plan.g];
 return `<div class="card stack" style="border:1.5px solid color-mix(in srgb,var(--good) 40%,var(--line))"><div class="row between"><div class="label" style="color:var(--good)">Sugestão para o ${nm.toLowerCase()}</div>${kc?`<span class="small muted num">cerca de ${plan.target[m]} kcal</span>`:""}</div>
 <p class="tiny muted">Objetivo: ${gLabel} · <button class="btn ghost sm" data-act="foodPrefs" style="min-height:24px;padding:1px 8px">trocar</button></p>
 ${!(opts&&opts.noReasons)&&plan.reasons.length?`<div class="stack-s">${plan.reasons.slice(0,3).map(r=>`<p class="small">· ${r}</p>`).join("")}</div>`:""}
 ${list.map((s,i)=>`<div class="card flat stack" style="gap:6px"><div class="row between"><b>${esc(s.name)}</b>${kc?`<span class="small num">${s.st.kcal} kcal</span>`:""}</div>
  <p class="tiny muted">${s.items.map(([n,q])=>`${q!==1?String(q).replace(".",",")+" × ":""}${esc(n)}`).join(" · ")}</p>
  ${s.tags.length?`<div class="row wrap" style="gap:6px">${s.tags.map(t=>`<span class="pill info" style="padding:2px 8px">${t}</span>`).join("")}</div>`:""}
  <button class="btn line sm" data-act="addSuggestion" data-meal="${m}" data-v="${esc(s.name)}" style="align-self:flex-start">${I.plus.replace('<svg','<svg width="14" height="14"')} Adicionar ao ${nm.toLowerCase()}</button></div>`).join("")}
 ${opts&&opts.more===false?"":`<button class="btn ghost sm" data-act="moreSuggest" data-v="${m}" style="align-self:flex-start">Ver mais opções</button>`}
 ${!plan.known&&kc?`<p class="tiny muted">Para sugestões na medida certa, informe sexo, idade, peso e altura em Preferências.</p>`:""}</div>`}

const wEntries=()=>vals(S.weight.entries).sort((a,b)=>a.date.localeCompare(b.date)||(a.t||0)-(b.t||0));
const fmtKg=v=>(Math.round(v*10)/10).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" kg";
function weightView(){const es=wEntries();const first=es[0],last=es[es.length-1];const goal=+S.weight.goal||0;const h=S.profile.height?(S.profile.height>3?S.profile.height/100:S.profile.height):0;
 const per=UI.wPer||"mes";const days={semana:7,mes:31,seis:183,tudo:99999}[per];const from=addDays(today(),-days);const shown=es.filter(e=>e.date>=from);
 const diff=last&&first?last.kg-first.kg:0;const bmiNow=last&&h?last.kg/(h*h):null;
 return `<div class="card stack"><div class="grid3" style="text-align:center"><div class="stack-s"><b class="num" style="font-size:20px">${first?fmtKg(first.kg):"—"}</b><span class="tiny muted">Peso inicial</span></div><div class="stack-s"><b class="num" style="font-size:20px">${last?fmtKg(last.kg):"—"}</b><span class="tiny muted">Peso atual</span></div><button class="stack-s" style="border:0;background:none;padding:0" data-act="weightGoal"><b class="num" style="font-size:20px">${goal?fmtKg(goal):"Definir"}</b><span class="tiny muted">Meta ✎</span></button></div>
 <button class="btn block" data-act="addWeight">${I.plus.replace('<svg','<svg width="18" height="18"')} Adicionar uma pesagem</button></div>
 ${es.length?`<div class="card stack"><div class="subtabs">${[["semana","7 dias"],["mes","1 mês"],["seis","6 meses"],["tudo","Tudo"]].map(([id,n])=>`<button class="${per===id?"on":""}" data-act="wPer" data-v="${id}">${n}</button>`).join("")}</div>
  ${es.length>1?`<p class="small" style="text-align:center;font-weight:700;color:var(--muted)">Variação de ${diff>0?"+":""}${fmtKg(diff)} desde o início</p>`:""}
  ${weightChart(shown.length?shown:es.slice(-1),goal)}
  <p class="tiny muted">O peso muda de um dia para o outro por causa de água, sal e intestino. Pese-se de manhã, em jejum, uma vez por semana, e olhe a tendência, não um número isolado.</p></div>`
 :`<div class="card empty">Registre seu peso para acompanhar a evolução. Uma pesagem por semana é suficiente.</div>`}
 ${bmiNow?`<div class="card stack"><div class="row between"><div class="label">IMC</div><b class="num">${bmiNow.toFixed(1).replace(".",",")}</b></div><p class="small muted">A faixa de peso considerada saudável para a sua altura vai de ${fmtKg(18.5*h*h)} a ${fmtKg(24.9*h*h)}. O IMC é só uma referência e não considera músculos nem o tipo de corpo.</p></div>`:""}
 ${es.length?`<div class="section"><div class="label">Pesagens registradas</div><div class="card list">${es.slice().reverse().map(e=>`<button class="item" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;padding-inline:0" data-act="editWeight" data-v="${e.id}"><b class="grow num">${fmtKg(e.kg)}</b><span class="small muted">${parseDate(e.date).toLocaleDateString("pt-BR",{day:"numeric",month:"short",year:"numeric"})}</span>${I.right.replace('<svg','<svg width="16" height="16" style="color:var(--muted)"')}</button>`).join("")}</div></div>`:""}`}
function weightChart(es,goal){const W=320,H=190,L=34,R=10,T=14,B=26;const vals2=es.map(e=>e.kg).concat(goal?[goal]:[]);let lo=Math.floor((Math.min(...vals2)-2)/5)*5,hi=Math.ceil((Math.max(...vals2)+2)/5)*5;if(hi-lo<10)hi=lo+10;
 const t0=parseDate(es[0].date).getTime(),t1=parseDate(es[es.length-1].date).getTime();const span=Math.max(1,t1-t0);
 const x=e=>es.length===1?L+(W-L-R)/2:L+(parseDate(e.date).getTime()-t0)/span*(W-L-R);const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
 const step=(hi-lo)/((hi-lo)>20?4:2)>=5?Math.ceil((hi-lo)/4/5)*5:5;let grid="";for(let v=lo;v<=hi+0.01;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
 const pts=es.map(e=>`${x(e).toFixed(1)},${y(e.kg).toFixed(1)}`).join(" ");
 const lab=(e,anchor)=>`<text x="${x(e)}" y="${H-8}" text-anchor="${anchor}" font-size="10" fill="var(--muted)">${parseDate(e.date).toLocaleDateString("pt-BR",{day:"numeric",month:"short"})}</text>`;
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico do peso">${grid}
 ${goal?`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ink)" stroke-dasharray="5 4" opacity=".6"/><text x="${W-R}" y="${y(goal)-5}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">Meta ${fmtKg(goal)}</text>`:""}
 ${es.length>1?`<polyline points="${pts}" fill="none" stroke="var(--good)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}
 ${es.map((e,i)=>`<circle cx="${x(e)}" cy="${y(e.kg)}" r="${i===es.length-1?4.5:3}" fill="var(--good)"/>`).join("")}
 ${lab(es[0],es.length===1?"middle":"start")}${es.length>1?lab(es[es.length-1],"end"):""}</svg></div>`}
function weightForm(e){e=e||{};const isEdit=!!e.id;openModal(isEdit?"Editar pesagem":"Nova pesagem",`<div class="stack">
 <label class="field"><span>Peso (kg)</span><input id="wg_kg" inputmode="decimal" value="${e.kg?String(e.kg).replace(".",","):""}" placeholder="Ex.: 80,5" style="font-size:24px;font-weight:700"></label>
