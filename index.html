/* ---------- Finanças ---------- */
{id:"f15",tr:"fin",t:"Inflação: o dinheiro que encolhe",a:"Base: Banco Central do Brasil",b:["Inflação é o aumento geral dos preços. Quando ela é de 5% ao ano, o que custava R$ 100 passa a custar R$ 105, e o mesmo dinheiro compra menos.","Por isso, dinheiro parado na conta corrente perde valor com o tempo. A reserva e os objetivos precisam render pelo menos a inflação.","Fique de olho no IPCA, o índice oficial de inflação. Um investimento que rende menos que o IPCA está, na prática, fazendo você perder dinheiro."],p:"Compare quanto rendeu seu dinheiro guardado no último ano com o IPCA do mesmo período.",q:{q:"Se a inflação foi de 5% e seu dinheiro rendeu 3%, o que aconteceu?",o:["Você perdeu poder de compra","Você ganhou dinheiro","Nada mudou"],a:0,e:"Rendeu menos que a alta dos preços, então compra menos que antes."}},
{id:"f16",tr:"fin",t:"Cartão de crédito a seu favor",a:"Orientação do Prumo",b:["O cartão não é dinheiro extra: é dinheiro do seu salário do mês que vem. Usado com controle, ajuda a organizar; sem controle, vira a dívida mais cara do país.","Três regras simples: pague sempre a fatura inteira, nunca só o mínimo; anote cada compra no Prumo no dia em que fizer; e conte as parcelas futuras como gasto já feito.","Conheça a melhor data de compra: comprando logo depois do fechamento da fatura, você ganha até 40 dias para pagar sem juros."],p:"Descubra o dia de fechamento da sua fatura e anote no calendário do Prumo.",q:{q:"O que acontece se você pagar só o mínimo da fatura?",o:["O resto entra no rotativo, com juros altíssimos","Nada, é uma opção sem custo","O banco perdoa o restante"],a:0,e:"O saldo restante passa a correr juros do rotativo, entre os mais altos do mercado."}},
{id:"f17",tr:"fin",t:"Onde guardar dinheiro com segurança",a:"Base: Tesouro Nacional e Fundo Garantidor de Créditos (FGC)",b:["Para a reserva de emergência, três características importam: segurança, resgate rápido e rendimento que acompanhe a inflação.","O Tesouro Selic é um título do governo federal, com resgate em um dia útil. CDBs de bancos com liquidez diária também servem, e têm a proteção do FGC até R$ 250 mil por CPF por instituição.","Desconfie de qualquer promessa de rendimento muito acima do mercado, sem risco. Em finanças, retorno alto sempre vem com risco alto."],p:"Pesquise no app do seu banco se ele oferece CDB com liquidez diária que renda pelo menos 100% do CDI.",q:{q:"O que é o FGC?",o:["Uma proteção para depósitos e CDBs até R$ 250 mil por banco","Um tipo de investimento de alto risco","Um imposto sobre aplicações"],a:0,e:"Se o banco quebrar, o FGC devolve até R$ 250 mil por CPF por instituição, dentro do limite global."}},
{id:"f18",tr:"fin",t:"Apostas: por que a casa sempre ganha",a:"Orientação do Prumo, com base em matemática básica de probabilidade",b:["Casas de apostas e jogos de azar são feitos para lucrar. As probabilidades são calculadas para que, no longo prazo, a maioria das pessoas perca.","Ganhar de vez em quando faz parte do desenho: a vitória ocasional mantém a pessoa jogando. Tentar recuperar o que perdeu costuma aumentar a perda.","Se apostar virou forma de buscar dinheiro, aliviar o estresse ou se esconder dos problemas, é sinal de alerta. Há tratamento gratuito pelo SUS, nos CAPS, e grupos como os Jogadores Anônimos."],p:"Se você aposta, some quanto gastou nos últimos 3 meses e quanto ganhou. Olhe o número com honestidade.",q:{q:"No longo prazo, quem costuma sair ganhando nas apostas?",o:["A casa de apostas","Quem aposta todo dia","Quem conhece bem o esporte"],a:0,e:"As probabilidades são calculadas para a casa lucrar com o conjunto de apostadores."}},
{id:"f19",tr:"fin",t:"Nome sujo: como consultar e sair",a:"Base: Código de Defesa do Consumidor e Banco Central",b:["Para saber o que está no seu nome, consulte de graça o Serasa, o SPC e o Registrato, do Banco Central, que mostra dívidas com bancos.","Pelo Código de Defesa do Consumidor, a informação negativa não pode ficar nos cadastros por mais de 5 anos. Mas atenção: o nome sair do cadastro não significa que a dívida deixou de existir.","Negocie direto com a empresa ou em plataformas oficiais. Depois de pagar, a empresa tem até 5 dias úteis para tirar seu nome do cadastro de inadimplentes. Guarde os comprovantes."],p:"Consulte hoje seu CPF no Serasa e no Registrato e anote as dívidas encontradas na aba Dívidas.",q:{q:"Depois de quitar a dívida, em quanto tempo o nome deve sair do cadastro?",o:["Até 5 dias úteis","Até 1 ano","Só depois de 5 anos"],a:0,e:"Quitada a dívida, a empresa tem até 5 dias úteis para pedir a retirada."}},
{id:"f20",tr:"fin",t:"Renda extra sem cair em armadilha",a:"Orientação do Prumo",b:["Uma renda extra temporária acelera muito a saída das dívidas: vender o que não usa, fazer bicos na sua área, oferecer um serviço que você já sabe fazer.","Fuja de promessas de dinheiro fácil: pirâmides financeiras, marketing que exige comprar estoque ou pagar para entrar, robôs de investimento milagrosos e tarefas pagas que pedem depósito antes.","Uma regra boa: se para ganhar você precisa primeiro pagar ou trazer outras pessoas, desconfie."],p:"Liste três coisas que você sabe fazer ou tem em casa e que poderiam virar renda extra.",q:{q:"Qual destes é um sinal típico de pirâmide financeira?",o:["Ganhar principalmente trazendo novas pessoas","Vender um produto pelo preço de mercado","Receber por hora trabalhada"],a:0,e:"Na pirâmide, o dinheiro vem da entrada de novos participantes, até que ela desmorona."}},
{id:"f21",tr:"fin",t:"À vista ou parcelado?",a:"Base: matemática financeira básica",b:["Parcelado sem juros pode valer a pena, se o preço for o mesmo que à vista e as parcelas couberem no orçamento.","Mas muitas vezes o preço à vista tem desconto. Se a loja dá 10% para pagar à vista, o parcelado embute esse custo.","Use o Posso comprar? do Prumo: ele mostra os juros escondidos no parcelamento e quanto das suas parcelas futuras já está comprometido."],p:"Na próxima compra, pergunte sempre: qual é o preço à vista?",q:{q:"Um produto custa R$ 900 à vista ou 10x de R$ 100. O parcelado:",o:["Tem R$ 100 de juros embutidos","É sem juros","É mais barato"],a:0,e:"10 × 100 = 1.000, R$ 100 a mais que o preço à vista."}},
{id:"f22",tr:"fin",t:"Aposentadoria começa cedo",a:"Orientação geral sobre previdência",b:["O INSS garante uma renda básica para quem contribui, mas para muitas pessoas ela é menor que o salário da vida ativa.","Autônomos e informais podem contribuir como contribuinte individual ou MEI, para ter direito à aposentadoria e ao auxílio em caso de doença.","Além do INSS, investir um pouco todo mês, por muitos anos, faz enorme diferença por causa dos juros compostos. Começar com pouco cedo é melhor que muito tarde."],p:"Confira no app Meu INSS quanto tempo de contribuição você já tem.",q:{q:"Por que começar cedo a guardar para a aposentadoria?",o:["Os juros compostos trabalham por mais tempo","Porque o INSS vai acabar","Porque é obrigatório"],a:0,e:"Quanto mais tempo o dinheiro rende, mais ele cresce sozinho."}},
{id:"f23",tr:"fin",t:"Dinheiro e filhos",a:"Base: educação financeira infantil",b:["Crianças aprendem sobre dinheiro observando os adultos. Conversar com naturalidade sobre escolhas e preços ensina mais que qualquer aula.","Mesada, mesmo pequena, ensina a planejar: a criança decide o que comprar e sente as consequências de gastar tudo de uma vez.","Uma ideia simples são três potes: gastar, guardar e doar. Quando a criança junta para algo que quer, aprende o valor da espera."],p:"Converse hoje com uma criança da família sobre uma escolha de compra que você fez.",q:{q:"Para que serve a mesada na educação financeira?",o:["Ensinar a planejar e fazer escolhas","Recompensar notas boas","Substituir a conversa sobre dinheiro"],a:0,e:"Com um valor fixo, a criança aprende a escolher e a planejar."}},
/* ---------- Alimentação ---------- */
{id:"a1",tr:"food",t:"Comida de verdade: a regra de ouro",a:"Base: Guia Alimentar para a População Brasileira (Ministério da Saúde)",b:["O Guia Alimentar brasileiro, reconhecido no mundo todo, resume tudo numa regra: prefira sempre alimentos naturais ou minimamente processados e preparações culinárias aos ultraprocessados.","Natural é arroz, feijão, ovos, carnes, frutas, verduras e legumes. Ultraprocessado é feito em fábrica com muitos ingredientes que você não teria em casa: refrigerante, biscoito recheado, salgadinho, macarrão instantâneo, embutidos.","Ultraprocessados são feitos para dar vontade de comer mais, e o consumo frequente está associado a obesidade, diabetes e doenças do coração."],p:"Hoje, troque um ultraprocessado por um alimento natural, como fruta no lugar do biscoito.",q:{q:"Qual destes é um alimento ultraprocessado?",o:["Biscoito recheado","Arroz com feijão","Banana"],a:0,e:"É feito em fábrica, com açúcar, gordura e aditivos. Arroz, feijão e banana são comida de verdade."}},
{id:"a2",tr:"food",t:"Como ler o rótulo",a:"Base: Anvisa, nova rotulagem nutricional",b:["Desde 2022, produtos com muito açúcar adicionado, gordura saturada ou sódio trazem na frente uma lupa preta com o aviso \"alto em\". Quanto mais lupas, mais motivo para deixar na prateleira.","Leia a lista de ingredientes: eles vêm em ordem do que tem mais para o que tem menos. Se açúcar aparece entre os primeiros, ou há muitos nomes que você não reconhece, é sinal de ultraprocessado.","Desconfie de embalagens com promessas como \"natural\" ou \"fit\". O que vale é a lista de ingredientes."],p:"No próximo mercado, leia a lista de ingredientes de um produto que você compra sempre.",q:{q:"Na lista de ingredientes, o primeiro item é:",o:["O que está em maior quantidade","O mais saudável","O menos importante"],a:0,e:"Os ingredientes vêm em ordem decrescente de quantidade."}},
{id:"a3",tr:"food",t:"Montando um prato equilibrado",a:"Base: método do prato, usado por nutricionistas",b:["Uma forma simples de montar a refeição: metade do prato com verduras e legumes, um quarto com proteína (carne, frango, peixe, ovo) e um quarto com carboidrato (arroz, batata, mandioca, macarrão).","O feijão entra como parceiro do arroz. Juntos, eles formam uma combinação de proteínas de ótima qualidade, além de fibras e ferro. É um tesouro da comida brasileira.","Variar as cores do prato garante mais vitaminas e minerais."],p:"No almoço de hoje, monte o prato com metade de salada e legumes.",q:{q:"No método do prato, quanto deve ser de verduras e legumes?",o:["Metade do prato","Um quarto","Uma colher"],a:0,e:"Metade do prato com verduras e legumes garante fibras, vitaminas e saciedade."}},
{id:"a4",tr:"food",t:"O açúcar escondido",a:"Base: Organização Mundial da Saúde",b:["A OMS recomenda que os açúcares adicionados fiquem abaixo de 10% das calorias do dia, e o ideal é menos de 5%. Para muitos adultos, isso dá no máximo umas 6 a 12 colheres de chá por dia.","Uma lata de refrigerante comum já tem cerca de 35 g de açúcar, perto de 7 colheres de chá. Sucos de caixinha, achocolatados e iogurtes adoçados também têm bastante.","Reduzir aos poucos funciona: o paladar se acostuma em algumas semanas e o doce passa a parecer doce demais."],p:"Esta semana, troque o refrigerante ou o suco de caixinha por água, água com limão ou suco natural sem açúcar.",q:{q:"Quanto açúcar tem, aproximadamente, uma lata de refrigerante comum?",o:["Cerca de 7 colheres de chá","Meia colher de chá","Nenhum"],a:0,e:"São cerca de 35 g de açúcar numa lata de 350 ml."}},
{id:"a5",tr:"food",t:"Sal e pressão alta",a:"Base: Organização Mundial da Saúde e Ministério da Saúde",b:["A OMS recomenda menos de 5 g de sal por dia, mais ou menos uma colher de chá. O brasileiro consome, em média, quase o dobro disso.","Excesso de sal aumenta a pressão arterial, um dos principais fatores de risco para infarto e AVC.","A maior parte do sal vem de alimentos prontos: embutidos, temperos em cubo, salgadinhos, molhos e fast food. Temperar com alho, cebola, ervas e limão dá sabor sem tanto sal."],p:"Troque o tempero pronto em cubo por alho, cebola e ervas na próxima refeição que você cozinhar.",q:{q:"Qual é o limite de sal recomendado pela OMS por dia?",o:["Menos de 5 g","Até 15 g","Não há limite"],a:0,e:"Menos de 5 g por dia, cerca de uma colher de chá."}},
{id:"a6",tr:"food",t:"Água: o básico que esquecemos",a:"Base: orientações gerais de hidratação",b:["A água participa de quase tudo no corpo: temperatura, digestão, funcionamento dos rins e até concentração.","A necessidade varia com peso, calor e atividade física. Uma referência comum é cerca de 35 ml por quilo por dia, vindos de água e alimentos. A cor da urina ajuda: clara indica boa hidratação.","Sentir sede já é um sinal de que o corpo pede água. Deixe uma garrafa por perto e use o lembrete de água do Prumo."],p:"Ative o lembrete de água em Saúde > Alimentação.",q:{q:"Qual sinal simples ajuda a perceber se você está bem hidratado?",o:["A cor clara da urina","Sentir fome","A temperatura do quarto"],a:0,e:"Urina clara costuma indicar boa hidratação; escura pede mais água."}},
{id:"a7",tr:"food",t:"Comer bem gastando pouco",a:"Orientação do Prumo, unindo finanças e alimentação",b:["Comida de verdade costuma ser mais barata que ultraprocessados: arroz, feijão, ovos, legumes e frutas da época rendem muito.","Planeje o cardápio da semana e faça a lista antes de ir ao mercado. Comprar com fome e sem lista leva para o carrinho o que você não precisa.","Feiras no fim do horário, frutas e verduras da estação e cozinhar em maior quantidade para congelar economizam tempo e dinheiro."],p:"Planeje o cardápio de três dias da próxima semana e faça a lista de compras a partir dele.",q:{q:"Qual hábito mais ajuda a gastar menos no mercado?",o:["Ir com lista e sem fome","Ir sem planejar","Comprar o que estiver em oferta"],a:0,e:"A lista evita compras por impulso, e a fome aumenta a vontade de levar o que não precisa."}},
{id:"a8",tr:"food",t:"Fome física ou fome emocional?",a:"Orientação com base em psicologia da alimentação",b:["A fome física chega aos poucos, aceita vários alimentos e passa quando você come. A fome emocional chega de repente, pede algo específico, geralmente doce ou gorduroso, e muitas vezes vem com culpa depois.","Ansiedade, tédio, tristeza e cansaço costumam disparar a fome emocional. Comer para aliviar uma emoção é humano, mas quando vira o único jeito de lidar, vale cuidar disso.","Antes de comer por impulso, pare um minuto e pergunte: estou com fome ou estou sentindo outra coisa? Às vezes uma caminhada, um copo de água ou uma conversa resolvem melhor."],p:"Na próxima vontade repentina de comer, espere 5 minutos e note o que você está sentindo.",q:{q:"Qual é uma característica da fome emocional?",o:["Chega de repente e pede um alimento específico","Chega aos poucos e aceita qualquer comida","Passa sempre depois de comer"],a:0,e:"A fome emocional é súbita e específica. A física é gradual e flexível."}},
{id:"a9",tr:"food",t:"Proteína sem gastar muito",a:"Base: Tabela TACO e Guia Alimentar",b:["Proteínas ajudam a manter os músculos, dão saciedade e são essenciais em qualquer idade, ainda mais para quem quer emagrecer ou tem mais de 50 anos.","Boas fontes acessíveis: ovos, feijão, lentilha, grão-de-bico, frango, sardinha, leite e iogurte natural. Arroz com feijão já fornece uma boa combinação.","Distribuir a proteína ao longo do dia, em todas as refeições, funciona melhor do que concentrar tudo no jantar."],p:"Inclua uma fonte de proteína no seu café da manhã de amanhã, como ovo, iogurte ou queijo.",q:{q:"Qual destas é uma fonte de proteína barata e versátil?",o:["Ovo","Refrigerante","Biscoito de polvilho"],a:0,e:"O ovo tem proteína de alta qualidade e custa pouco por porção."}},
{id:"a10",tr:"food",t:"Cuidado com dietas da moda",a:"Base: orientações gerais de nutrição",b:["Dietas muito restritivas prometem resultados rápidos, mas costumam ser difíceis de manter. Depois, o peso tende a voltar, às vezes com sobra.","Uma perda de peso saudável costuma ficar entre 0,5 e 1 kg por semana, com mudanças que você consegue manter: mais comida de verdade, menos ultraprocessados, mais movimento e sono melhor.","Cortar grupos inteiros de alimentos sem orientação, ficar longos períodos sem comer ou usar remédios sem receita pode fazer mal. Um nutricionista monta um plano para você. Se a relação com a comida estiver causando sofrimento, procure ajuda."],p:"Escolha uma única mudança de alimentação que você consegue manter pelo próximo mês.",q:{q:"Qual é um ritmo saudável de perda de peso?",o:["0,5 a 1 kg por semana","5 kg por semana","Quanto mais rápido, melhor"],a:0,e:"Mudanças graduais são mais seguras e mais fáceis de manter."}},
/* ---------- Exercício físico ---------- */
{id:"e1",tr:"ex",t:"Por que se movimentar",a:"Base: Organização Mundial da Saúde",b:["Segundo a OMS, a atividade física regular reduz o risco de doenças do coração, AVC, diabetes tipo 2, alguns tipos de câncer, depressão e ansiedade.","Ela também melhora o sono, a disposição, a memória e ajuda a manter a independência na velhice.","O sedentarismo está entre os principais fatores de risco de morte no mundo. A boa notícia: qualquer movimento já conta, e os maiores ganhos vêm de sair do zero."],p:"Faça hoje uma caminhada de 10 minutos e registre na aba Saúde.",q:{q:"Para quem é sedentário, de onde vêm os maiores ganhos?",o:["De sair do zero e começar a se mexer","Só de treinos intensos","De treinar 3 horas por dia"],a:0,e:"Passar de nada para um pouco de movimento traz o maior benefício para a saúde."}},
{id:"e2",tr:"ex",t:"Quanto exercício é suficiente",a:"Base: diretrizes da OMS (2020)",b:["Para adultos, a OMS recomenda de 150 a 300 minutos por semana de atividade moderada, ou de 75 a 150 minutos de atividade vigorosa, ou uma combinação das duas.","Além disso, exercícios de fortalecimento muscular em pelo menos 2 dias da semana. Para quem tem 65 anos ou mais, a OMS recomenda também exercícios de equilíbrio.","150 minutos parece muito, mas são 30 minutos em 5 dias, ou três caminhadas de 10 minutos por dia."],p:"Confira seu plano em Saúde > Exercícios e veja quantos minutos faltam nesta semana.",q:{q:"Quanta atividade moderada a OMS recomenda por semana para adultos?",o:["De 150 a 300 minutos","30 minutos","1.000 minutos"],a:0,e:"De 150 a 300 minutos de atividade moderada, mais força 2 vezes por semana."}},
{id:"e3",tr:"ex",t:"Leve, moderado ou vigoroso?",a:"Base: teste da fala, usado por educadores físicos",b:["Um jeito simples de medir a intensidade é o teste da fala. Na atividade leve, você conversa e até canta. Na moderada, consegue falar, mas não cantar. Na vigorosa, fica difícil dizer mais que algumas palavras.","Caminhada rápida, bicicleta tranquila, dança e hidroginástica costumam ser moderadas. Corrida, futebol e pedalada forte costumam ser vigorosas.","No Prumo, a atividade leve conta metade e a vigorosa conta em dobro para a meta semanal."],p:"Na próxima caminhada, faça o teste da fala e acelere até a intensidade moderada.",q:{q:"Se você consegue falar, mas não cantar, a atividade é:",o:["Moderada","Leve","Vigorosa"],a:0,e:"Esse é o sinal clássico da intensidade moderada."}},
{id:"e4",tr:"ex",t:"Força muscular não é só para atleta",a:"Base: OMS e estudos sobre envelhecimento",b:["A partir dos 30 a 40 anos, perdemos massa muscular aos poucos, e o ritmo aumenta com a idade. Isso afeta força, equilíbrio, metabolismo e independência.","Exercícios de força, feitos 2 vezes por semana, freiam essa perda. Não precisa de academia: agachamento na cadeira, flexão na parede, subir degraus e carregar sacolas já trabalham os músculos.","Para quem quer emagrecer, a força ajuda a manter os músculos enquanto o corpo perde gordura."],p:"Faça hoje 2 séries de 10 agachamentos sentando e levantando de uma cadeira.",q:{q:"Quantas vezes por semana a OMS recomenda exercícios de força?",o:["Pelo menos 2","Nenhuma, basta caminhar","Todos os dias, obrigatoriamente"],a:0,e:"Pelo menos 2 dias por semana, trabalhando os principais grupos musculares."}},
{id:"e5",tr:"ex",t:"Começando do zero",a:"Orientação com base em psicologia do hábito",b:["O maior erro de quem começa é exagerar no primeiro dia e desistir no terceiro. Comece pequeno: 10 minutos de caminhada já é um ótimo começo.","Aumente aos poucos, cerca de 10 minutos a mais por semana, até chegar à meta. Escolha uma atividade de que você goste: o melhor exercício é o que você consegue manter.","Ligue o exercício a algo que já faz parte do dia, como caminhar depois do almoço, e marque na agenda como um compromisso."],p:"Crie uma tarefa recorrente na agenda para o seu exercício da semana.",q:{q:"Qual é a melhor forma de começar a se exercitar?",o:["Começar pequeno e aumentar aos poucos","Treinar pesado todos os dias desde o início","Esperar estar em forma para começar"],a:0,e:"Começar pequeno evita lesão e desistência."}},
{id:"e6",tr:"ex",t:"Dor boa e dor de alerta",a:"Orientação geral de segurança",b:["É normal sentir os músculos doloridos um ou dois dias depois de um exercício novo. Essa dor tardia passa sozinha e diminui conforme o corpo se acostuma.","Dor forte e súbita, dor nas articulações que piora com o movimento ou inchaço são sinais para parar e descansar. Se não melhorar, procure um profissional.","Aquecer por 5 minutos antes, com uma caminhada leve e movimentos das articulações, e desacelerar no final ajudam a prevenir lesões."],p:"Antes do próximo exercício, faça 5 minutos de aquecimento.",q:{q:"Músculos doloridos um dia depois de um exercício novo geralmente:",o:["São normais e passam sozinhos","Exigem ida imediata ao hospital","Significam que você deve parar para sempre"],a:0,e:"É a dor muscular tardia, comum quando o corpo faz algo novo."}},
{id:"e7",tr:"ex",t:"Exercício também cuida da mente",a:"Base: OMS e pesquisas em saúde mental",b:["A atividade física regular ajuda a reduzir sintomas de ansiedade e depressão, melhora o humor e a qualidade do sono.","Durante o exercício, o corpo libera substâncias associadas ao bem-estar, e a sensação de cumprir algo por você mesmo fortalece a autoestima.","Não substitui tratamento quando ele é necessário, mas é um ótimo aliado. Até uma caminhada curta ao ar livre pode mudar o dia."],p:"No próximo dia em que estiver ansioso ou desanimado, tente uma caminhada de 15 minutos e note como se sente depois.",q:{q:"Qual destes é um benefício do exercício para a mente?",o:["Ajuda a reduzir ansiedade e melhora o sono","Elimina a necessidade de qualquer tratamento","Não tem efeito no humor"],a:0,e:"Ajuda muito, mas não substitui tratamento quando ele é necessário."}},
{id:"e8",tr:"ex",t:"Ficar sentado demais",a:"Base: diretrizes da OMS (2020)",b:["Mesmo quem se exercita pode passar tempo demais sentado, no trabalho, no carro e no sofá. A OMS recomenda reduzir o tempo sentado e substituir por qualquer movimento.","Uma regra prática: a cada hora sentado, levante por alguns minutos. Beba água, ande pela casa, alongue, suba um lance de escada.","Pequenas mudanças somam: descer um ponto antes do ônibus, usar a escada, conversar ao telefone andando."],p:"Hoje, levante-se por 3 minutos a cada hora em que estiver sentado.",q:{q:"Qual é uma boa prática para quem passa o dia sentado?",o:["Levantar alguns minutos a cada hora","Compensar só no fim de semana","Nada, se treinar de manhã"],a:0,e:"Quebrar o tempo sentado traz benefícios mesmo para quem já treina."}},
{id:"e9",tr:"ex",t:"Sono: o treino invisível",a:"Base: recomendações gerais de sono para adultos",b:["Adultos costumam precisar de 7 a 9 horas de sono por noite. Dormir mal aumenta a fome, piora o humor, a concentração e a recuperação dos músculos.","Exercício ajuda a dormir melhor, mas treinos muito intensos perto da hora de deitar podem atrapalhar algumas pessoas.","Horários regulares, quarto escuro, menos telas antes de dormir e evitar café à noite fazem diferença."],p:"Esta noite, deixe o celular longe da cama 30 minutos antes de dormir.",q:{q:"Quantas horas de sono os adultos costumam precisar?",o:["De 7 a 9 horas","De 4 a 5 horas","12 horas ou mais"],a:0,e:"A maioria dos adultos precisa de 7 a 9 horas para se recuperar bem."}},
{id:"e10",tr:"ex",t:"Quando procurar um médico",a:"Base: questionário PAR-Q e orientações de segurança",b:["Antes de começar, responda ao questionário de prontidão do Prumo. Se marcar algum item, converse com um médico antes de aumentar a intensidade.","Pare o exercício e procure atendimento se sentir dor ou aperto no peito, falta de ar fora do normal, tontura, palpitação forte ou desmaio.","Pessoas com pressão alta, diabetes, doenças do coração, gestantes e idosos podem e devem se exercitar, mas com orientação."],p:"Preencha ou revise o questionário de saúde em Saúde > Exercícios > Atualizar meus dados.",q:{q:"Se sentir dor no peito durante o exercício, o que fazer?",o:["Parar e procurar atendimento","Continuar para ver se passa","Acelerar o ritmo"],a:0,e:"Dor no peito é sinal de alerta. Pare e procure ajuda."}},
/* ---------- Mente e espiritualidade ---------- */
{id:"s1",tr:"mind",t:"Para que serve a oração",a:"Reflexão do Prumo, respeitando todas as crenças",b:["Para quem tem fé, a oração é uma conversa com Deus: um momento de agradecer, entregar preocupações, pedir força e direção.","Muitas pessoas relatam que orar traz paz, esperança e a sensação de não estar sozinho diante das dificuldades. Pesquisas em saúde observam que, para quem crê, a vida espiritual pode ser fonte de conforto e de apoio em momentos difíceis.","A oração não substitui o cuidado com a saúde, mas pode caminhar junto com ele. Rezar, procurar o médico e conversar com alguém de confiança não se excluem."],p:"Se você tem fé, reserve 5 minutos hoje para uma oração com suas próprias palavras.",q:{q:"Como a oração se relaciona com o cuidado com a saúde?",o:["Pode caminhar junto, sem substituir o tratamento","Substitui o médico","Não tem relação com o bem-estar de quem crê"],a:0,e:"Para quem crê, a oração pode trazer conforto, e o cuidado médico continua importante."}},
{id:"s2",tr:"mind",t:"E para quem não tem religião",a:"Reflexão do Prumo, respeitando todas as crenças",b:["Nem todo mundo tem fé, e tudo bem. O Prumo respeita igualmente quem crê e quem não crê: a aba de Oração é opcional, e há a opção \"Outra ou minha própria\".","Muitos benefícios associados à oração também aparecem em práticas sem religião: pausas de silêncio, gratidão, reflexão sobre o dia, meditação e contato com a natureza.","O que importa é ter momentos de pausa, sentido e conexão: com você mesmo, com as pessoas e com o que você considera importante."],p:"Escolha uma prática de pausa que combine com você: silêncio, gratidão, natureza ou meditação.",q:{q:"Qual destas práticas pode trazer pausa e bem-estar para quem não tem religião?",o:["Gratidão, silêncio e meditação","Nenhuma, só a oração funciona","Ficar mais tempo nas redes sociais"],a:0,e:"Práticas de pausa e reflexão ajudam qualquer pessoa, com ou sem fé."}},
{id:"s3",tr:"mind",t:"Três coisas boas",a:"Base: exercício de gratidão estudado na psicologia positiva (Martin Seligman)",b:["Um exercício simples e estudado: antes de dormir, escreva três coisas boas que aconteceram no dia e por que elas aconteceram.","Pode ser pequeno: um café quentinho, uma conversa, uma tarefa concluída. Com o tempo, o cérebro passa a notar mais o que vai bem, sem negar o que vai mal.","Estudos com esse exercício observaram aumento de bem-estar em quem praticou por algumas semanas."],p:"Hoje à noite, escreva três coisas boas do seu dia.",q:{q:"No exercício das três coisas boas, você anota:",o:["Três coisas boas do dia e por que aconteceram","Três problemas a resolver","Três metas para o ano"],a:0,e:"O foco é treinar a atenção para o que foi bom, sem ignorar o resto."}},
{id:"s4",tr:"mind",t:"Respirar para acalmar",a:"Base: técnicas de respiração usadas em psicologia",b:["Quando a ansiedade aperta, a respiração fica curta e rápida, e isso alimenta a sensação de alarme. Respirar devagar manda ao corpo a mensagem contrária.","Experimente: inspire pelo nariz contando até 4, solte o ar pela boca contando até 6. Repita por 2 a 5 minutos. Soltar o ar mais devagar do que puxa ajuda o corpo a desacelerar.","Funciona melhor se você treinar nos momentos calmos, para usar quando precisar."],p:"Pratique agora 1 minuto de respiração: inspire em 4, solte em 6.",q:{q:"Na respiração para acalmar, o ideal é:",o:["Soltar o ar mais devagar do que puxa","Respirar o mais rápido possível","Prender a respiração por um minuto"],a:0,e:"Expirar mais longo ajuda o corpo a sair do estado de alarme."}},
{id:"s5",tr:"mind",t:"Silêncio e atenção plena",a:"Base: práticas de atenção plena (mindfulness)",b:["Atenção plena é prestar atenção no momento presente, de propósito e sem julgamento: na respiração, nos sons, nas sensações do corpo.","Quando a mente se distrai, e ela vai se distrair, apenas perceba e volte com gentileza para a respiração. Esse voltar é o exercício.","Começar com 5 minutos por dia já ajuda. Dá para praticar também em atividades comuns, como lavar a louça prestando atenção na água e nos movimentos."],p:"Faça 5 minutos de silêncio, prestando atenção na respiração. Use o timer da aba Estudos.",q:{q:"Na atenção plena, quando a mente se distrai, você deve:",o:["Perceber e voltar com gentileza para a respiração","Desistir, porque não está funcionando","Brigar com você mesmo"],a:0,e:"Distrair-se é normal. Voltar com gentileza é o próprio treino."}},
{id:"s6",tr:"mind",t:"Perdoar faz bem",a:"Reflexão com base em psicologia e em tradições espirituais",b:["Perdoar não é esquecer, nem dizer que o que aconteceu estava certo, nem voltar a conviver com quem te faz mal. É decidir não carregar mais o peso da raiva.","Guardar mágoa por muito tempo mantém a pessoa presa ao que doeu. Perdoar costuma ser um processo, não um momento.","Perdoar a si mesmo também conta: errar faz parte, e aprender com o erro é mais útil do que se culpar para sempre. Em situações de violência, a prioridade é a sua segurança."],p:"Pense numa mágoa pequena e escreva o que você ganharia ao deixá-la ir.",q:{q:"Perdoar significa:",o:["Decidir não carregar mais o peso da raiva","Esquecer tudo o que aconteceu","Aceitar ser maltratado"],a:0,e:"Perdoar não exige esquecer nem aceitar abuso."}},
{id:"s7",tr:"mind",t:"Ninguém floresce sozinho",a:"Base: pesquisas sobre vínculos sociais e saúde",b:["Pesquisas de longo prazo mostram que boas relações estão entre os fatores mais ligados à saúde e à felicidade ao longo da vida. A solidão prolongada, ao contrário, faz mal ao corpo e à mente.","Comunidade pode ser a igreja, um grupo de amigos, a família, um time, um grupo de caminhada ou de voluntariado.","Cultivar vínculos dá trabalho: ligar, visitar, ouvir. Mas é um dos melhores investimentos que existem."],p:"Mande hoje uma mensagem para alguém de quem você gosta e não fala há tempos.",q:{q:"O que as pesquisas mostram sobre relações e saúde?",o:["Boas relações estão ligadas a mais saúde e felicidade","Relações não influenciam a saúde","Viver isolado é mais saudável"],a:0,e:"Vínculos de qualidade protegem a saúde física e mental."}},
{id:"s8",tr:"mind",t:"Quando pedir ajuda",a:"Orientação de saúde mental",b:["Todo mundo passa por dias difíceis. Mas quando a tristeza, a ansiedade ou o desânimo duram semanas, atrapalham o trabalho, o sono, a alimentação ou as relações, é hora de procurar ajuda.","Psicólogos e psiquiatras cuidam da saúde mental como médicos cuidam do corpo. Pelo SUS, a porta de entrada é a Unidade Básica de Saúde, e há os CAPS para casos mais graves. Muitas faculdades de psicologia oferecem atendimento gratuito ou barato.","Se você estiver pensando em se machucar ou sentir que não aguenta mais, ligue para o CVV pelo 188, de graça e a qualquer hora, ou procure um pronto-socorro. Pedir ajuda é um ato de coragem."],p:"Salve o número 188 nos contatos do seu celular. Pode ser útil para você ou para alguém próximo.",q:{q:"Onde começar a buscar atendimento em saúde mental pelo SUS?",o:["Na Unidade Básica de Saúde","Só em hospitais particulares","Não existe atendimento pelo SUS"],a:0,e:"A UBS é a porta de entrada, e os CAPS atendem casos mais graves."}}];

{id:"cc1",tr:"fin",t:"Controle total: chato no começo, libertador depois",a:"Base: Prelec e Simester (MIT, 2001) e Banco Central do Brasil",b:["Anotar cada gasto e cada compra no cartão pode parecer chato, e é normal sentir isso no começo. Mas quem não sabe para onde o dinheiro vai só descobre quando a fatura chega, e aí já é tarde para mudar.","O cartão esconde o gasto: você compra hoje e só sente no mês que vem. Pesquisas de economia comportamental mostram que, no cartão, as pessoas aceitam pagar mais do que pagariam em dinheiro, porque a dor de pagar diminui.","Somadas, as parcelas pequenas viram uma fatura grande que ocupa o salário antes mesmo de ele cair. Ter tudo anotado é o que permite ver esse peso antes que ele vire dívida.","O controle não precisa ser perfeito, só constante. Lançar na hora ou importar a fatura uma vez por mês já muda o jogo. Com o tempo, o que era obrigação vira tranquilidade: você sabe quanto pode gastar sem medo."],p:"Hoje, cadastre seus cartões com limite, fechamento e vencimento, e importe a última fatura.",q:{q:"Por que vale lançar uma compra parcelada logo que você compra?",o:["Porque as parcelas já comprometem os próximos meses","Porque o banco cobra menos juros","Não faz diferença"],a:0,e:"Cada parcela é um pedaço do salário futuro que já tem dono. Vendo isso antes, você evita a fatura surpresa."}},
{id:"cc2",tr:"fin",t:"Como funciona a fatura do cartão",a:"Base: Banco Central do Brasil e Lei 14.690/2023",b:["Fechamento é o dia em que o banco fecha a conta do mês: o que você comprar depois dele vai para a fatura seguinte. Vencimento é o dia de pagar, normalmente de 7 a 10 dias depois do fechamento.","Por isso, o melhor dia de compra é o próprio dia do fechamento ou logo depois: você ganha até 40 dias para pagar sem juros.","Numa compra parcelada, o banco bloqueia o valor inteiro do limite e vai liberando a cada fatura paga. Por isso o limite disponível parece encolher.","Pagar só o mínimo joga o resto no rotativo, um dos juros mais altos do país. O rotativo só pode durar até a fatura seguinte; depois disso o banco precisa oferecer um parcelamento. Desde 2024, por lei, os juros e encargos do rotativo e do parcelamento da fatura não podem passar de 100% do valor da dívida."],p:"Descubra o dia de fechamento dos seus cartões e cadastre no Prumo, em Finanças > Cartões.",q:{q:"Seu cartão fecha dia 3 e vence dia 10. Qual o melhor dia para uma compra grande?",o:["Dia 3, no fechamento","Dia 9, véspera do vencimento","Dia 1"],a:0,e:"Comprando no fechamento, a compra vai para a fatura seguinte e você ganha quase 40 dias para pagar."}});
const trackLessons=tr=>LESSONS.filter(l=>l.tr===tr);

function trackCard(tr,compact){const t=TRACKS[tr];const ls=trackLessons(tr);const rd=ls.filter(l=>S.learn.read[l.id]).length;
 return `<button class="card stack" style="text-align:left;gap:6px" data-act="openTrack" data-v="${tr}"><div class="row"><span class="ico" style="background:color-mix(in srgb,${t.c} 16%,transparent);color:${t.c}">${I[t.ic].replace('<svg','<svg width="20" height="20"')}</span><div class="grow stack-s" style="gap:1px"><b>${t.n}</b>${compact?"":`<span class="tiny muted">${t.d}</span>`}</div><span class="pill info num">${rd}/${ls.length}</span></div><div class="meter"><i style="width:${rd/ls.length*100}%;background:${t.c}"></i></div></button>`}
function viewLearn(){const tr=UI.learnTrack;
 if(tr){const t=TRACKS[tr];const ls=trackLessons(tr);return `<div class="stack"><div class="row"><button class="iconbtn" data-act="openTrack" data-v="" aria-label="Voltar">${I.left}</button><h2>${t.n}</h2></div><p class="small muted">${t.d}</p>${lessonList(ls)}</div>`}
 const tot=LESSONS.length,rd=LESSONS.filter(l=>S.learn.read[l.id]).length;
 return `<div class="stack"><div class="row"><button class="iconbtn" data-act="tab" data-v="home" aria-label="Voltar">${I.left}</button><h2>Aprender</h2></div>
 <div class="card stack"><div class="row between"><b>Seu progresso</b><span class="pill info num">${rd}/${tot} lições</span></div><div class="meter"><i style="width:${rd/tot*100}%"></i></div>
 <p class="small muted">Lições curtas, com uma tarefa prática e uma pergunta para fixar.${S.profile.pet?" Cada lição lida vale 10 pontos para o guarda-roupa do porquinho, e cada pergunta certa vale mais 5.":""}</p></div>
 ${Object.keys(TRACKS).map(k=>trackCard(k)).join("")}</div>`}
function lessonList(ls){return `<div class="card list">${ls.map((l,i)=>`<button class="item" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;padding-inline:0" data-act="lesson" data-v="${l.id}"><span class="ico" style="background:${S.learn.read[l.id]?"var(--good)":"var(--pig-soft)"};color:${S.learn.read[l.id]?"#fff":"var(--pig-deep)"}">${S.learn.read[l.id]?I.check.replace('<svg','<svg width="18" height="18"'):i+1}</span><div class="grow stack-s" style="gap:1px"><p style="white-space:normal"><b>${esc(l.t)}</b></p><p class="tiny muted" style="white-space:normal">${esc(l.a)}${S.learn.quiz&&S.learn.quiz[l.id]?" · pergunta certa":""}</p></div>${I.right.replace('<svg','<svg width="18" height="18" style="flex:none;color:var(--muted)"')}</button>`).join("")}</div>`}
function trackLink(tr,label){const t=TRACKS[tr];const ls=trackLessons(tr);const rd=ls.filter(l=>S.learn.read[l.id]).length;const next=ls.find(l=>!S.learn.read[l.id]);
 return `<div class="card stack" style="gap:8px"><div class="row between"><div class="label" style="color:${t.c}">${label||"Aprender"}</div><span class="pill info num">${rd}/${ls.length}</span></div>
 ${next?`<button class="row" style="border:0;background:none;padding:0;text-align:left;gap:10px" data-act="lesson" data-v="${next.id}"><span class="grow stack-s" style="gap:1px"><b>${esc(next.t)}</b><span class="tiny muted">${esc(next.b[0].slice(0,90))}…</span></span>${I.right.replace('<svg','<svg width="18" height="18" style="flex:none;color:var(--muted)"')}</button>`:`<p class="small">Você leu todas as lições desta trilha.</p>`}
 <button class="btn ghost sm" data-act="goTrack" data-v="${tr}" style="align-self:flex-start">Ver todas as lições</button></div>`}
function lessonTeaser(){const unread=LESSONS.filter(l=>!S.learn.read[l.id]&&(l.tr!=="mind"||true));if(!unread.length)return `<button class="card row" style="text-align:left" data-act="tab" data-v="learn"><b class="grow">Aprender</b><span class="small muted">Rever lições</span></button>`;
 const order=["fin","food","ex","mind"];const tr=order[(parseDate(today()).getDate())%order.length];const next=unread.find(l=>l.tr===tr)||unread[0];const t=TRACKS[next.tr];
 return `<div class="card stack" style="gap:8px"><button style="border:0;background:none;padding:0;text-align:left" data-act="lesson" data-v="${next.id}"><div class="label" style="color:${t.c}">Lição do dia · ${t.n}</div><h3 style="margin-top:6px">${esc(next.t)}</h3><p class="small muted" style="margin-top:4px">${esc(next.b[0])}</p></button><button class="btn ghost sm" data-act="tab" data-v="learn" style="align-self:flex-start">Todas as trilhas de aprendizado</button></div>`}
function finLearn(){return `${trackCard("fin")}${lessonList(trackLessons("fin"))}<button class="btn ghost" data-act="tab" data-v="learn">Ver as outras trilhas: alimentação, exercício e mente</button>`}
function lessonView(id){const l=LESSONS.find(x=>x.id===id);if(!l)return;const done=!!S.learn.read[id];const qd=S.learn.quiz&&S.learn.quiz[id];const ans=UI.quizAns&&UI.quizAns[id];const t=TRACKS[l.tr];
 const ls=trackLessons(l.tr);const i=ls.findIndex(x=>x.id===id);const n=ls[i+1];
 openModal(l.t,`<div class="stack lesson prose"><p class="label" style="color:${t.c}">${t.n} · lição ${i+1} de ${ls.length}</p><p class="small muted">${esc(l.a)}</p>${l.b.map(p=>`<p>${esc(p)}</p>`).join("")}
 <div class="card flat"><div class="label" style="margin-bottom:6px">Na prática</div><p>${esc(l.p)}</p></div>
 ${l.q?`<div class="card stack"><div class="label">Pergunta rápida</div><p><b>${esc(l.q.q)}</b></p><div class="stack-s">${quizOrder(l).map(oi=>{const o=l.q.o[oi];const chosen=ans!=null&&ans===oi;const right=oi===l.q.a;const show=ans!=null;
   return `<button class="btn ${show&&right?"money":show&&chosen?"danger":"line"} block" style="justify-content:flex-start;text-align:left;white-space:normal;height:auto;padding:10px 14px" data-act="quiz" data-v="${id}" data-o="${oi}" ${show?"disabled":""}>${esc(o)}</button>`}).join("")}</div>
  ${ans!=null?`<p class="small" style="color:${ans===l.q.a?"var(--good)":"var(--bad)"}"><b>${ans===l.q.a?"Isso mesmo!":"Quase."}</b> ${esc(l.q.e)}</p>${ans!==l.q.a?`<button class="btn ghost sm" data-act="quizRetry" data-v="${id}" style="align-self:flex-start">Tentar de novo</button>`:""}`:qd?`<p class="tiny muted">Você já acertou esta pergunta.</p>`:""}</div>`:""}
 ${done?`<span class="pill good" style="align-self:flex-start">Lição concluída</span>`:`<button class="btn block" data-act="lessonDone" data-v="${id}">Marcar como lida${S.profile.pet?" (+10 pontos)":""}</button>`}
 ${n?`<button class="btn ghost" data-act="lesson" data-v="${n.id}">Próxima: ${esc(n.t)}</button>`:`<button class="btn ghost" data-act="goTrack" data-v="${l.tr}">Fim da trilha · ver todas</button>`}</div>`)}
function quizOrder(l){let h=0;for(const c of l.id)h=(h*31+c.charCodeAt(0))%997;const idx=l.q.o.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){h=(h*17+7)%997;const j=h%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}

const FOCUS=[["fin","Organizar o dinheiro"],["saude","Cuidar da saúde"],["estudo","Estudar e ler mais"],["rotina","Organizar tarefas e agenda"],["fe","Cuidar da fé e da mente"]];

function habitPrinciples(){const it=(ic,t,d)=>`<div class="row" style="align-items:flex-start;gap:12px"><span class="ico" style="background:var(--pig-soft);color:var(--pig-deep);flex:none">${ic.replace('<svg','<svg width="20" height="20"')}</span><div class="stack-s" style="gap:2px"><b>${t}</b><span class="small muted">${d}</span></div></div>`;
 return `<div class="card stack">${it(I.flame,"Dois minutos por dia","O Prumo pede pouco: uma missão rápida por área, todo dia. O hábito vem antes da perfeição.")}${it(I.check,"Um passo de cada vez","Escolha as áreas que quer acompanhar. Pode ser uma, pode ser todas: você decide.")}${it(I.heart,"Errar faz parte","Esqueceu um dia? Sua sequência tem um dia de folga por semana. O importante é voltar.")}</div>`}
function habitForm(sel,why,time){return `<div class="field"><span>Por onde você quer começar? Escolha quantas quiser.</span><div class="chips" style="flex-wrap:wrap">${FOCUS.map(([id,n])=>`<button type="button" class="chip ${sel.includes(id)?"on":""}" data-act="focusPick" data-v="${id}">${n}</button>`).join("")}</div></div>
 <label class="field"><span>Qual é o seu motivo? (opcional)</span><input id="h_why" maxlength="90" value="${esc(why||"")}" placeholder="Ex.: viajar com a família"></label>
 <div class="chips" style="flex-wrap:wrap;margin-top:-4px">${WHY_EX.map(w=>`<button type="button" class="chip" data-act="whyPick" data-v="${esc(w)}">${esc(w)}</button>`).join("")}</div>
 <label class="check"><input type="checkbox" id="h_rem" ${S.profile.remindOn?"checked":""}><span><b>Quero um lembrete diário na agenda</b><br><span class="tiny muted">Um aviso por dia para usar o Prumo. Opcional.</span></span></label>

function pixPayload(amount){const f=(id,v)=>id+String(v.length).padStart(2,"0")+v;const clean=(t,n)=>norm(t).toUpperCase().replace(/[^A-Z0-9 ]/g,"").slice(0,n)||"PRUMO";
 const acc=f("00","BR.GOV.BCB.PIX")+f("01",PIX.key.trim())+f("02","Doacao Prumo");
 const body=f("00","01")+f("26",acc)+f("52","0000")+f("53","986")+(amount?f("54",amount.toFixed(2)):"")+f("58","BR")+f("59",clean(PIX.name,25))+f("60",clean(PIX.city||"BRASIL",15))+f("62",f("05","***"))+"6304";
 return body+crc16(body)}

const CARD_QUICK=["Nubank","Itaú","Bradesco","Santander","Banco do Brasil","Caixa","Inter","C6 Bank","Mercado Pago","PicPay","Neon","XP"];

function cardsList(){return Object.entries(meta().cards||{}).filter(([,v])=>v).map(([id,v])=>({id,...v}))}
function cardById(id){const c=(meta().cards||{})[id];return c?{id,...c}:null}
function dayIn(k,day){const [y,m]=k.split("-").map(Number);const dim=new Date(y,m,0).getDate();return k+"-"+pad(Math.min(Math.max(1,+day||1),dim))}
/* Mês em que vence a fatura de uma compra feita em `date` */
function invoiceMonth(card,date){const close=+card.close||1,due=+card.due||10;let k=mkey(date);
 if(parseDate(date).getDate()>=close)k=shiftMonth(k,1);
 if(due<=close)k=shiftMonth(k,1);
 return k}
const ccKey=k=>k.replace("-","");
function cardItems(cardId){const out=[];for(const k of allMonths())for(const e of monthData(k).expenses)if(e.card===cardId)out.push({...e,k});return out}
function invPaid(cardId,k){return!!(((meta().cardPaid||{})[cardId]||{})[ccKey(k)])}
function cardInvoices(card){const by={};cardItems(card.id).forEach(e=>{(by[e.k]=by[e.k]||[]).push(e)});
 return Object.keys(by).sort().map(k=>({k,items:by[k].sort((a,b)=>(a.bought||a.date).localeCompare(b.bought||b.date)),total:sum(by[k]),paid:invPaid(card.id,k),due:dayIn(k,card.due)}))}
function cardUsed(card){return cardInvoices(card).filter(i=>!i.paid).reduce((s,i)=>s+i.total,0)}
function invStatus(card,inv){const open=invoiceMonth(card,today());
 if(inv.paid)return{k:"good",t:"Paga"};
 if(inv.k>open)return{k:"info",t:"Futura"};
 if(inv.k===open)return{k:"info",t:"Aberta"};
 if(inv.due<today())return{k:"bad",t:"Vencida"};
 return{k:"warn",t:"Fechada"}}

function ccPurchaseEntries(card,{total,n,desc,cat,bought,grp,by,t,added,startI,firstK}){n=Math.max(1,+n||1);startI=startI||1;
 const each=Math.round(total/n*100)/100;const k0=firstK||invoiceMonth(card,bought);const out={};
 for(let i=startI;i<=n;i++){const k=shiftMonth(k0,i-startI);const v=i===n?Math.round((total-each*(n-1))*100)/100:each;
  (out[k]=out[k]||{})[`cc_${grp}_${i}`]={v,desc,cat,date:dayIn(k,card.due),card:card.id,bought,grp,i,n,total:Math.round(total*100)/100,by,t,added}}

 const dre=/^(\d{1,2})\s*(?:[\/\-.]\s*(\d{1,2})|\s+de\s+([a-zç]{3})[a-z]*\.?|\s*([a-zç]{3})[a-z]*\.?)(?:\s*[\/\-.]\s*(\d{2,4}))?\s+(.*)$/i;
 const vre=/(-?\s*(?:R\$)?\s*-?\s*\d{1,3}(?:\.\d{3})*,\d{2}|-?\s*(?:R\$)?\s*\d+,\d{2})\s*(?:[CD]\b)?\s*$/i;
 for(let j=0;j<lines.length;j++){const m=dre.exec(lines[j]);if(!m)continue;const date=mkDate(m[1],m[2]||m[3]||m[4],m[5]);if(!date)continue;let rest=m[6];let vm=vre.exec(rest);
  if(!vm&&lines[j+1]&&vre.test(lines[j+1])&&!dre.test(lines[j+1])){vm=vre.exec(lines[j+1]);rest=rest+" "+lines[j+1];j++;vm=vre.exec(rest)}
  if(!vm)continue;let val=moneyNum(vm[1]);if(val===null)continue;if(/\bC\s*$/.test(rest))val=-Math.abs(val);const desc=rest.slice(0,vm.index).replace(/\s*R\$\s*$/,"").trim();if(!desc)continue;out.push({date,v:val,desc})}
 return out}
function normalizeRows(raw,card,k){if(!raw.length)return[];
 const negs=raw.filter(r=>r.v<0).length;const flip=negs>raw.length/2; // OFX costuma trazer compras negativas
 const existing={};for(const kk of [k,shiftMonth(k,-1),shiftMonth(k,1)])for(const e of monthData(kk).expenses)if(e.card===card.id){existing[kk+"|"+normDesc(e.desc)+"|"+Math.round(e.v*100)]=1;if(+e.n>1)existing[kk+"|"+normDesc(e.desc)+"|p"+e.i+"/"+e.n]=1}
 const seen={};
 return raw.map(r=>{let v=flip?-r.v:r.v;if(v<=0||IGNORE_RE.test(r.desc))return null;const p=splitParc(r.desc);const nd=normDesc(p.desc);
  const dup=!!(existing[k+"|"+nd+"|"+Math.round(v*100)]||(p.n>1&&existing[k+"|"+nd+"|p"+p.i+"/"+p.n]));const sk=r.date+nd+v;const rep=seen[sk];seen[sk]=1;
  return{date:r.date,desc:p.desc||r.desc,v:Math.round(v*100)/100,i:p.i,n:p.n,cat:guessCat(p.desc||r.desc),on:!dup,dup,rep:!!rep}}).filter(Boolean)}

const qEsc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qBRL=n=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(+n||0);
function qTotals(q){const items=(q.items||[]).filter(i=>i&&(i.d||+i.v));const sub=items.reduce((s,i)=>s+(+i.q||0)*(+i.v||0),0);const disc=Math.min(sub,+q.discount||0);return{items,sub,disc,total:Math.max(0,sub-disc)}}
function qDateBR(s){if(!s)return"";const [y,m,d]=String(s).slice(0,10).split("-");return `${d}/${m}/${y}`}
function qValidUntil(q){if(!q.validity||!q.created)return null;const d=new Date(String(q.created).slice(0,10)+"T12:00:00");d.setDate(d.getDate()+(+q.validity||0));return d.toISOString().slice(0,10)}
function qNum(q){return String(q.num||0).padStart(4,"0")}
function qNormKey(type,key){key=String(key||"").trim();if(type==="cpf"||type==="cnpj")return key.replace(/\D/g,"");if(type==="telefone"){const d=key.replace(/\D/g,"");return key.startsWith("+")?"+"+d:"+55"+d.replace(/^55(?=\d{10,11}$)/,"")}if(type==="email")return key.toLowerCase();return key}
function qPixPayload(key,name,city,amount,txid){const norm=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"");const f=(id,v)=>id+String(v.length).padStart(2,"0")+v;const clean=(t,n,dflt)=>norm(t).toUpperCase().replace(/[^A-Z0-9 ]/g,"").trim().slice(0,n)||dflt;
 const acc=f("00","BR.GOV.BCB.PIX")+f("01",key);
 const body=f("00","01")+f("26",acc)+f("52","0000")+f("53","986")+(amount>0?f("54",amount.toFixed(2)):"")+f("58","BR")+f("59",clean(name,25,"RECEBEDOR"))+f("60",clean(city,15,"BRASIL"))+f("62",f("05",(txid||"***").replace(/[^A-Za-z0-9]/g,"").slice(0,25)||"***"))+"6304";
 let c=0xFFFF;for(let i=0;i<body.length;i++){c^=body.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}
 return body+c.toString(16).toUpperCase().padStart(4,"0")}
const Q_UNITS=["un","h","sessão","serviço","m","m²","kg","dia","mês","pacote"];
const Q_PIXT=[["cpf","CPF"],["cnpj","CNPJ"],["email","E-mail"],["telefone","Telefone"],["aleatoria","Chave aleatória"]];
function qWaLink(num,text){const d=String(num||"").replace(/\D/g,"");const n=d?(d.length<=11?"55"+d:d):"";return `https://wa.me/${n}${text?"?text="+encodeURIComponent(text):""}`}

   Recado do mascote: por que o Prumo existe (com a voz do mascote)
   ============================================================ */
function pigFace(equip){return pigSVG({score:80,mood:"feliz",equip:equip||{},env:1,dry:false,peace:0}).replace(/viewBox="[^"]*"/,'viewBox="62 48 196 196"')}
function letterPig(){return S.profile.pet!==false}
function letterWho(){return S.pet&&S.pet.name?esc(S.pet.name):"seu mascote"}
function letterParas(short){const pig=letterPig();const who=letterWho();
 const P=[pig?`Oinc! Eu sou o ${who}. Meu criador é graduado em Psicologia e me colocou aqui porque vê todos os dias como a bagunça com dinheiro, saúde e rotina pesa na cabeça das pessoas. Não por falta de vontade, mas porque ninguém ensina como fazer.`
   :`Oi! Eu sou o Prumo. Meu criador é graduado em Psicologia e me fez porque vê todos os dias como a bagunça com dinheiro, saúde e rotina pesa na cabeça das pessoas. Não por falta de vontade, mas porque ninguém ensina como fazer.`,
  `Vou ser sincero: anotar gastos e registrar hábitos pode parecer chato no começo. É normal! Mas é esse pequeno esforço que traz clareza, e clareza traz tranquilidade. Quem sabe para onde vai o próprio dinheiro dorme melhor.`,
  `Você não precisa ser perfeito. Dois minutos por dia já fazem diferença. Esqueceu um dia? Tudo bem, o importante é voltar.${pig?" Eu vou estar aqui te esperando.":""}`,
  pig?`O Prumo é gratuito e sempre vai ser. Ele não existe para dar lucro: existe para te ajudar.`:`Sou gratuito e sempre vou ser. Não existo para dar lucro: existo para te ajudar.`];
 return short?[P[0],P[1]]:P}
function letterAvatar(px){return letterPig()?`<div class="pigstage" style="width:${px}px;flex:none;border-radius:50%;aspect-ratio:1;overflow:hidden" aria-hidden="true">${pigFace(S.profile.created?effectiveEquip():{head:null,face:null,neck:null})}</div>`:`<div style="flex:none">${logoHTML(Math.round(px*.32))}</div>`}
function letterTitle(){return letterPig()?(S.pet&&S.pet.name?`Um recado do ${esc(S.pet.name)}`:"Um recado do seu mascote"):"Um recado do Prumo"}
function letterBubble(paras){return `<div style="position:relative;background:var(--pig-soft);border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.5"><span style="position:absolute;top:-8px;left:34px;width:16px;height:16px;background:var(--pig-soft);transform:rotate(45deg)"></span><div class="stack-s" style="position:relative;gap:10px">${paras.map(p=>`<p>${p}</p>`).join("")}</div></div>`}
function letterBlock(){return `<div class="stack" style="gap:10px"><div class="row" style="gap:12px;align-items:flex-end">${letterAvatar(88)}${letterPig()?`<b style="color:var(--pig-deep);font-family:var(--f-display);font-size:20px">${letterTitle()}</b>`:""}</div>${letterBubble(letterParas(false))}</div>`}
function letterModal(){openModal(letterTitle().replace(/<[^>]+>/g,""),`<div class="stack">${letterBlock()}<button class="btn block" data-act="letterOk">${letterPig()?"Oinc! Combinado":"Combinado"}</button></div>`)}
/* cartões no Início */
function daysSinceLastActive(){const td=today();const ks=Object.keys(S.activity||{}).filter(d=>d<td).sort();if(!ks.length)return 0;return Math.round((parseDate(td)-parseDate(ks[ks.length-1]))/864e5)}

 const gap=daysSinceLastActive();
 if(gap>=5&&p.backSeen!==td){const pig=letterPig();return `<div class="card stack" style="border:2px solid var(--pig)"><div class="row" style="gap:12px;align-items:flex-end">${letterAvatar(72)}<b style="color:var(--pig-deep)">${pig?(S.pet&&S.pet.name?esc(S.pet.name)+" sentiu sua falta":"Seu mascote sentiu sua falta"):"Que bom te ver de volta"}</b></div>

  <button class="btn sm" data-act="backOk" style="align-self:flex-end">${pig?"Oinc! Bora":"Vamos lá"}</button></div>`}
 const days=Math.round((parseDate(td)-parseDate(p.created))/864e5);
 if(!p.letterSeen&&(days<=7||Store.demo))return `<div class="card stack" style="border:2px solid var(--pig)"><div class="row" style="gap:12px;align-items:flex-end">${letterAvatar(72)}<b style="color:var(--pig-deep)">${letterTitle()}</b></div>${letterBubble(letterParas(true))}

function PJ(){S.projects=S.projects||{};S.projects.items=S.projects.items||{};return S.projects}

const CFG=window.PRUMO_CONFIG||{};
const SB_ON=!!(CFG.supabaseUrl&&CFG.supabaseKey&&window.supabase);
const sb=SB_ON?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}}):null;
Store.sb=sb;
function sbDb(){
 const parentOf=p=>p.split("/").slice(0,-1).join("/"),idOf=p=>p.split("/").pop();
 const snap=row=>({id:idOf(row.path),exists:true,data:()=>row.data,metadata:{hasPendingWrites:false,fromCache:false}});
 const none=p=>({id:idOf(p),exists:false,data:()=>undefined,metadata:{hasPendingWrites:false,fromCache:false}});
 const fail=e=>({code:e&&(e.code==="42501"||/row-level security/i.test(e.message||""))?"invalid_argument":"unavailable",message:e&&e.message});
 function subscribe(col,val,deliver){let alive=true;
  const load=async()=>{const {data,error}=await sb.from("docs").select("path,data").eq(col,val);if(!alive||error)return;deliver(data||[])};
  load();const ch=sb.channel("c"+rid()).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:`${col}=eq.${val}`},()=>load()).subscribe();
  const iv=setInterval(load,30000);const vis=()=>{if(!document.hidden)load()};document.addEventListener("visibilitychange",vis);
  return()=>{alive=false;clearInterval(iv);document.removeEventListener("visibilitychange",vis);try{sb.removeChannel(ch)}catch(e){}}}
 return{
  doc(path){return{
   async get(){const {data,error}=await sb.from("docs").select("path,data").eq("path",path).maybeSingle();if(error)throw fail(error);return data?snap(data):none(path)},
   async set(obj){const {error}=await sb.from("docs").upsert({path,parent:parentOf(path),data:obj,updated_at:new Date().toISOString()});if(error)throw fail(error)},
   async update(patch){const {data,error}=await sb.rpc("merge_doc",{p_path:path,p_patch:patch});if(error)throw fail(error);if(data===false)throw{code:"invalid_argument",message:"documento não existe"}},
   async delete(){const {error}=await sb.from("docs").delete().eq("path",path);if(error)throw fail(error)},
   onSnapshot(cb){return subscribe("path",path,rows=>cb(rows[0]?snap(rows[0]):none(path)))}}},
  collection(path){return{onSnapshot(cb){return subscribe("parent",path,rows=>cb({docs:rows.map(snap)}))}}}}}
let SESSION=null;
async function connectCloud(){
 if(typeof DEMO_ON!=="undefined"&&DEMO_ON){startDemo();return}
 if(!SB_ON)return;
 let data=null;try{({data}=await sb.auth.getSession())}catch(e){}SESSION=data&&data.session;
 if(!SESSION){UI.needAuth=localModeChosen()?false:true;render();return}
 await connectWithUser(SESSION.user.id);
}
async function connectWithUser(uid){
 UI.needAuth=false;
 const db=sbDb();const localS=S,localFin=clone(PFIN);
 Store.db=db;ME.uid=uid;
 let snap;try{snap=await db.doc(appPath()).get()}catch(e){toast("Sem conexão. Usando os dados salvos neste aparelho.");render();return}
 Store.cloud=true;Store.localOnly=false;
 const shareOn=()=>{const a={};SHARE_AREAS.forEach(([k])=>a[k]=true);S.profile.shareAreas=a;S.profile.shareAdmin=true;S.profile.shareAt=today();S.profile.shareAsked=1;S.profile.shareSource="cadastro"};
 if(snap.exists){S=hydrate(snap.data())}
 else if(localS.profile.created){S=localS;shareOn();await db.doc(appPath()).set(clone(S)).catch(()=>{});
  for(const k in localFin){await db.doc(`data/users/${uid}/fin-${k}`).set(stripNulls(localFin[k])).catch(()=>{})}}
 else{S=defaultState();shareOn();UI.onb=-1}

}

const LN=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
let lnTimer=null;
function scheduleNative(){const ln=LN();if(!ln)return;clearTimeout(lnTimer);lnTimer=setTimeout(async()=>{try{
 const perm=await ln.checkPermissions();if(perm.display!=="granted"){const r=await ln.requestPermissions();if(r.display!=="granted")return}
 const pend=await ln.getPending();if(pend.notifications.length)await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
 const list=[];let nid=1;const now=Date.now();
 for(let i=0;i<45&&list.length<60;i++){const d=addDays(today(),i);for(const e of eventsOn(d)){if(!e.time)continue;const [h,m]=e.time.split(":").map(Number);const at=parseDate(d);at.setHours(h,m,0,0);const when=new Date(at.getTime()-(+e.remind||0)*60000);if(when.getTime()>now)list.push({id:nid++,title:e.title,body:(e.remind>0?"Em "+e.remind+" min · ":"Agora · ")+e.time+(e.place?" · "+e.place:""),schedule:{at:when}})}}
 const water=waterSlots().slice(0,20).map((t,i)=>({id:5000+i,title:"Hora de beber água",body:"Um copo agora ajuda a bater sua meta do dia.",schedule:{on:{hour:Math.floor(t/60),minute:t%60},repeats:true}}));
 const all=[...water,...list.slice(0,Math.max(0,62-water.length))];
 if(all.length)await ln.schedule({notifications:all})}catch(e){console.warn(e)}},800)}

/* busca de livros online (Google Books, com Open Library como reserva) */
async function searchBooks(q){
 try{const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=8&printType=books&langRestrict=pt`);if(r.ok){const j=await r.json();const out=(j.items||[]).map(it=>{const v=it.volumeInfo||{};return{title:v.title+(v.subtitle?": "+v.subtitle:""),author:(v.authors||[]).join(", "),pages:v.pageCount||0,cover:v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail)?(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail).replace("http://","https://"):""}}).filter(b=>b.title);if(out.length)return out}}catch(e){}
 try{const r=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=8&fields=title,author_name,number_of_pages_median,cover_i`);if(r.ok){const j=await r.json();return(j.docs||[]).map(d=>({title:d.title,author:(d.author_name||[]).slice(0,2).join(", "),pages:d.number_of_pages_median||0,cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:""}))}}catch(e){}
 return null}

I.split='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4M12 12l-6.4 6.4"/></svg>';
let TEAMS=null,TINV=[],TUNSUB=[],TTIMER=null,tPending=0,tLoading=false;const TBASE={},TCOUNT={};
const teamsOn=()=>!!((typeof SB_ON!=="undefined"&&SB_ON&&Store.cloud)||Store.demo);
const lsTeam=v=>{try{if(v===undefined)return localStorage.getItem("prumo.team");if(v)localStorage.setItem("prumo.team",v);else localStorage.removeItem("prumo.team")}catch(e){return null}};
const teamFeatList=t=>TFEATS.filter(([k])=>t.features&&t.features[k]).map(x=>x[1]);
const iOwn=()=>TEAM&&TEAM.owner===ME.uid;

function mergeDiff(a,b){const out={};let any=false;a=a||{};
 for(const k in b){const x=a[k],y=b[k];if(y===undefined)continue;
  if(isObj(x)&&isObj(y)){const d=mergeDiff(x,y);if(d){out[k]=d;any=true}}
  else if(JSON.stringify(x)!==JSON.stringify(y)){out[k]=isObj(y)?stripNulls(clone(y)):y;any=true}}
 for(const k in a)if(!(k in b)||b[k]===undefined){out[k]=null;any=true}
 return any?out:null}

async function teamsLoad(){
 if(Store.demo){if(!TEAMS){demoTeams();render()}return}
 if(!sb||!Store.cloud||tLoading)return;tLoading=true;
 try{const [a,b]=await Promise.all([sb.rpc("my_teams"),sb.rpc("my_team_invites")]);if(a.error)throw a.error;
  TEAMS=a.data||[];TINV=(b&&!b.error&&b.data)||[];
  if(TEAM){const t=TEAMS.find(x=>x.id===TEAM.id);if(!t){teamExit();toast("Você não faz mais parte dessa equipe.")}
   else{const ch=JSON.stringify(t.features)!==JSON.stringify(TEAM.features);TEAM=t;if(ch)teamSubscribe()}}
  else{const last=lsTeam();if(last&&TEAMS.find(x=>x.id===last))teamEnter(last,true)}
  teamCounts();render();setTimeout(teamInvitePopup,400);setTimeout(teamPushPig,800)}catch(e){console.warn(e);if(TEAMS===null)TEAMS=[]}
 tLoading=false}
async function teamCounts(){if(Store.demo||!TEAMS)return;for(const t of TEAMS){if(!(t.features&&t.features.tasks))continue;
 try{const s=await Store.db.doc(`teams/${t.id}/agenda`).get();const items=s.exists&&s.data().tasks&&s.data().tasks.items||{};
  const n=vals(items).filter(x=>x.status!=="done"&&x.who===ME.uid).length;if(TCOUNT[t.id]!==n){TCOUNT[t.id]=n;if(!TEAM)render()}}catch(e){}}}
setInterval(()=>{if(teamsOn()&&!document.hidden)teamsLoad()},60000);

function teamEnter(id,silent){const t=(TEAMS||[]).find(x=>x.id===id);if(!t)return;
 TEAM=t;lsTeam(id);teamSubscribe();if(!silent){UI.tab="home";window.scrollTo(0,0)}render()}
function teamExit(){TUNSUB.forEach(u=>{try{u()}catch(e){}});TUNSUB=[];clearTimeout(TTIMER);TTIMER=null;tPending=0;
 TEAM=null;lsTeam(null);for(const k in TFIN)delete TFIN[k];for(const k in TD)delete TD[k];UI.teamWho="tudo";
 if(["vaq"].includes(UI.tab))UI.tab="home";render()}

function teamApply(path,data){const p=TPARTS.find(x=>x.path===path);if(!p)return;const fresh=deepMerge(p.def(),stripNulls(clone(data||{})));TD[path]=fresh;TBASE[path]=clone(fresh)}
function teamSubscribe(){TUNSUB.forEach(u=>{try{u()}catch(e){}});TUNSUB=[];
 for(const k in TFIN)delete TFIN[k];for(const k in TD)delete TD[k];
 if(!TEAM)return;const id=TEAM.id;
 TPARTS.forEach(p=>{if(p.on()){TD[p.path]=p.def();TBASE[p.path]=clone(TD[p.path])}});
 if(Store.demo){demoTeamData();return}
 if(TD.agenda)TUNSUB.push(Store.db.doc(`teams/${id}/agenda`).onSnapshot(s=>{if(tPending||!TEAM||TEAM.id!==id)return;teamApply("agenda",s.exists?s.data():{});render()},e=>console.warn(e)));
 if(TD.chal)TUNSUB.push(Store.db.doc(`teams/${id}/chal`).onSnapshot(s=>{if(tPending||!TEAM||TEAM.id!==id)return;teamApply("chal",s.exists?s.data():{});render()},e=>console.warn(e)));
 if(teamHas("fin")||teamHas("quotes")||teamHas("vaq"))TUNSUB.push(Store.db.collection(`teams/${id}/fin`).onSnapshot(qs=>{if(!TEAM||TEAM.id!==id)return;
  for(const d of qs.docs){if(d.id==="quotes"){if(!tPending)teamApply("fin/quotes",d.data())}else if(!d.metadata.hasPendingWrites)TFIN[d.id]=stripNulls(clone(d.data()))}render()},e=>console.warn(e)));
}
function teamSaveParts(){if(!TEAM)return;tPending=1;clearTimeout(TTIMER);const id=TEAM.id;
 TTIMER=setTimeout(async()=>{try{for(const p of TPARTS){if(!teamPart(p)||!TEAM||TEAM.id!==id)continue;const cur=clone(TD[p.path]);const patch=mergeDiff(TBASE[p.path],cur);if(!patch)continue;
   TBASE[p.path]=cur;if(Store.demo||!Store.cloud)continue;const ref=Store.db.doc(`teams/${id}/${p.path}`);
   try{await ref.update(patch)}catch(e){if(e&&e.code==="invalid_argument")await ref.set(stripNulls(cur));else throw e}}}
  catch(e){console.warn(e);toast("Não consegui salvar na equipe. Confira a internet.")}
  tPending=0;if(Store.demo||!Store.cloud||!TEAM||TEAM.id!==id)return;
  try{for(const pth of ["agenda","chal"]){if(!TD[pth])continue;const s=await Store.db.doc(`teams/${id}/${pth}`).get();if(!tPending&&TEAM&&TEAM.id===id){teamApply(pth,s.exists?s.data():{})}}render()}catch(e){}},600)}

const VQ=()=>{TFIN.vaq=TFIN.vaq||{};TFIN.vaq.items=TFIN.vaq.items||{};return TFIN.vaq};
function vaqPatch(patch){if(!TEAM)return;TFIN.vaq=deepMerge(TFIN.vaq||{},clone(patch));
 if(!Store.demo&&Store.cloud){const p=`teams/${TEAM.id}/fin/vaq`;enqueue(p,async()=>{const ref=Store.db.doc(p);try{await ref.update(patch)}catch(e){if(e&&e.code==="invalid_argument")await ref.set(stripNulls(clone(TFIN.vaq)));else throw e}})}
 render()}
const vqItems=()=>vals(VQ().items).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created||0)-(a.created||0));
const vqOpen=r=>Object.entries(r.shares||{}).some(([u,v])=>v!=null&&+v>0&&!(r.paid||{})[u]&&u!==r.payer);
const nm=u=>u===ME.uid?"Você":teamNick(u);
function vqDebts(){const net={};for(const r of vqItems()){if(!r.payer)continue;for(const [u,v] of Object.entries(r.shares||{})){if(v==null||u===r.payer||(r.paid||{})[u])continue;const k=u+">"+r.payer;net[k]=(net[k]||0)+(+v||0)}}
 const pairs={};for(const k in net){const [a,b]=k.split(">");const rev=net[b+">"+a]||0;if(net[k]>rev+0.005&&!pairs[k])pairs[k]=net[k]-rev}
 return Object.entries(pairs).map(([k,v])=>{const [from,to]=k.split(">");return{from,to,v}})}

   ============================================================ */
const SUP={data:null,loading:false,adm:null};
async function supLoad(){if(!sb||!Store.cloud||SUP.loading)return;SUP.loading=true;
 try{const {data,error}=await sb.rpc("my_support");if(error)throw error;SUP.data=data||{};
  const a=SUP.data.active;const cur=S.profile.supporter;
  if(a){const nx={plan:a.plan,since:a.since,until:a.until,ok:1};if(!cur||cur.until!==nx.until||!cur.ok){S.profile.supporter=nx;saveApp();render()}}
  else if(cur){delete S.profile.supporter;saveApp();render()}}
 catch(e){console.warn(e)}SUP.loading=false}
{const _rs=render;render=function(){_rs();if(Store.cloud&&!SUP.data&&!SUP.loading)setTimeout(supLoad,0)}}
setInterval(()=>{if(Store.cloud&&!document.hidden)supLoad()},5*60000);

function supBanner(){if(!Store.cloud||!SUP.data)return"";const d=SUP.data;let h="";
 if(d.pending&&d.pending.length)h+=`<div class="banner warn"><span>Recebemos seu aviso de ${d.pending.map(x=>brl(+x.amount)).join(" e ")}. Assim que o Pix for confirmado, o selo de Apoiador aparece no seu perfil.</span></div>`;
 if(d.rejected&&!(d.pending&&d.pending.length))h+=`<div class="banner bad"><span>Não encontramos o Pix de ${brl(+d.rejected.amount)} que você avisou. Se você enviou, avise de novo com o valor, a data e o nome de quem pagou.</span></div>`;
 return h}

 openModal("Avisar que fiz o Pix",`<div class="stack">

 <p class="tiny muted">Ao confirmar, o selo e os acessórios ficam ativos por 1 mês (doação livre ou mensal) ou 1 ano (anual), somando ao tempo que a pessoa já tinha. Ela recebe uma mensagem automática nos dois casos.</p></div>`}

/* ============================================================
   Desafios da equipe (estilo GymRats): check-in diário com foto, ranking e mural.
   Os dados ficam em teams/<id>/chal e as fotos no Storage (bucket "checkins"),
   reduzidas no aparelho antes de enviar (até ~720 px, JPEG leve).
   ============================================================ */
const CH_AUTO=[["none","Cada um marca o seu check-in"],["ex","Treino registrado em Saúde"],["study","Estudo registrado"],["food","Refeições anotadas no dia"],["fin","Gastos anotados no dia"],["prayer","Oração feita no dia"]];
const CH_PRESETS=[["30 dias de treino","ex",30,"Treinou, fez check-in. Vale academia, caminhada, corrida, futebol."],["Sem delivery","none",30,"Um dia sem pedir comida por aplicativo vale ponto."],["Ler todo dia","study",21,"Pelo menos 10 minutos de leitura ou estudo."],["Anotar todos os gastos","fin",30,"Anotou os gastos do dia no Prumo, ganhou ponto."],["Beber água","none",14,"Bateu a meta de água do dia."]];
const CH_REACT=["👏","🔥","💪"];
const CHP=()=>{S.challenges=S.challenges||{};S.challenges.items=S.challenges.items||{};return S.challenges};
const chEnd=c=>addDays(c.start,(+c.days||30)-1);
const chActive=c=>today()>=c.start&&today()<=chEnd(c);
const chDays=c=>{const out=[];for(let d=c.start;d<=chEnd(c)&&d<=today();d=addDays(d,1))out.push(d);return out};
function chPoints(c,u){const ck=(c.checkins||{})[u]||{};return Object.keys(ck).filter(d=>ck[d]&&d>=c.start&&d<=chEnd(c)).length}
function chStreak(c,u){const ck=(c.checkins||{})[u]||{};let n=0,d=today();if(!ck[d])d=addDays(d,-1);while(ck[d]&&d>=c.start){n++;d=addDays(d,-1)}return n}
function chRank(c){return teamMembers().map(m=>({u:m.uid,p:chPoints(c,m.uid),s:chStreak(c,m.uid),today:!!((c.checkins||{})[m.uid]||{})[today()]})).sort((a,b)=>b.p-a.p||b.s-a.s)}
/* atividade pessoal do dia (para o check-in automático) */
function chPersonalDid(kind,day){const T=TEAM;try{TEAM=null;return withPersonal(()=>{
 if(kind==="ex")return vals(S.ex.logs).some(l=>l.date===day);
 if(kind==="study")return (typeof studyMin==="function"?studyMin(day):0)>0;
 if(kind==="food")return vals(S.food.logs).some(l=>l.date===day);
 if(kind==="fin")return typeof finActivity==="function"&&!!finActivity(day);
 if(kind==="prayer"){const l=S.prayer.log[day];return !!(l&&Object.values(l).some(Boolean))}
 return false})}catch(e){return false}finally{TEAM=T}}
let chAutoBusy=false;
function chAutoCheck(){if(chAutoBusy||!TEAM||!teamHas("desafios")||!TD.chal)return;let changed=false;const d=today();
 for(const c of vals(CHP().items)){if(!chActive(c)||!c.auto||c.auto==="none"||chPhotoReq(c))continue;const mine=((c.checkins||{})[ME.uid]||{});if(mine[d]||(((c.skip||{})[ME.uid]||{})[d]))continue;
  if(chPersonalDid(c.auto,d)){c.checkins=c.checkins||{};c.checkins[ME.uid]=c.checkins[ME.uid]||{};c.checkins[ME.uid][d]={t:Date.now(),auto:1,note:(CH_AUTO.find(x=>x[0]===c.auto)||["",""])[1]};changed=true}}
 if(changed){chAutoBusy=true;setTimeout(()=>{chAutoBusy=false},2000);commit();toast("Check-in automático feito no desafio. Boa!")}}

/* ---------- fotos ---------- */
const PH={url:{},pending:new Set()};
async function chShrink(file){let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}
 const W=bmp.width,H=bmp.height,m=720,sc=Math.min(1,m/Math.max(W,H));const cv=document.createElement("canvas");cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
 let q=.6,blob=null;for(let k=0;k<5;k++){blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));if(blob.size<=110000)break;q-=.1}
 if(blob.size>280000){const c2=document.createElement("canvas");c2.width=Math.round(cv.width*.7);c2.height=Math.round(cv.height*.7);c2.getContext("2d").drawImage(cv,0,0,c2.width,c2.height);blob=await new Promise(r=>c2.toBlob(r,"image/jpeg",.5))}
 return blob}
const CH_PHOTO=[["opt","Opcional"],["req","Obrigatória"],["live","Obrigatória e tirada na hora"]];
const chPhotoReq=c=>c&&(c.photo==="req"||c.photo==="live");
const chLive=c=>c&&c.photo==="live";
/* câmera dentro do app: no desafio "foto na hora" não dá para escolher foto da galeria */
const CAM={stream:null,facing:"environment"};
function camStop(){if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null}}
async function camOpen(){const box=$("#ch_cam");if(!box)return;camStop();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){box.innerHTML=camErr("Este aparelho não deixa o Prumo usar a câmera.");return}
 box.innerHTML=`<div class="tiny muted" style="text-align:center;padding:30px 0">Abrindo a câmera…</div>`;
 try{CAM.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:CAM.facing,width:{ideal:1280},height:{ideal:1280}},audio:false})}
 catch(e){box.innerHTML=camErr(e&&e.name==="NotAllowedError"?"Você não deixou o Prumo usar a câmera. Libere a câmera nas permissões do navegador e tente de novo.":"Não consegui abrir a câmera deste aparelho.");return}
 if(!$("#ch_cam")){camStop();return}
 box.innerHTML=`<div class="camwrap"><video id="ch_vid" autoplay playsinline muted></video></div>
 <div class="row" style="gap:8px;justify-content:center"><button type="button" class="btn ghost sm" data-act="camFlip">🔄 Virar</button><button type="button" class="btn" data-act="camShot">📸 Tirar foto</button></div>`;
 const vd=$("#ch_vid");vd.srcObject=CAM.stream;vd.style.transform=CAM.facing==="user"?"scaleX(-1)":""}
const camErr=m=>`<div class="banner warn"><span>${m} Este desafio só aceita foto tirada na hora, pelo Prumo. Se não der por aqui, faça o check-in pelo celular.</span></div><button type="button" class="btn ghost sm" data-act="camOpen" style="align-self:center">Tentar de novo</button>`;
function camPanel(label){return `<div class="stack-s" style="gap:8px"><div class="tiny muted">📸 ${label}</div><div id="ch_cam" class="stack-s" style="gap:8px"><button type="button" class="chpick" data-act="camOpen" style="width:100%"><span class="stack-s" style="align-items:center;gap:4px">📷<b class="small">Abrir câmera</b><span class="tiny muted">Neste desafio só vale foto tirada agora</span></span></button></div></div>`}
{const _cm=closeModal;closeModal=function(){camStop();return _cm.apply(this,arguments)}}
function chPhotoTag(ck){const t=chPhotoTag0(ck);return t&&ck.live?t+`<span class="tiny muted">📸 Foto tirada na hora</span>`:t}
function chPhotoTag0(ck){if(ck.photoData)return `<img src="${ck.photoData}" alt="Foto do check-in" class="chph">`;if(!ck.photo)return"";const u=PH.url[ck.photo];
 return `<img ${u?`src="${u}"`:""} data-ph="${esc(ck.photo)}" alt="Foto do check-in" class="chph" loading="lazy">`}
async function chLoadPhotos(){if(Store.demo||!sb)return;const need=[...document.querySelectorAll("img[data-ph]:not([src])")].map(i=>i.dataset.ph).filter(p=>!PH.url[p]&&!PH.pending.has(p));if(!need.length)return;
 need.forEach(p=>PH.pending.add(p));try{const {data,error}=await sb.storage.from("checkins").createSignedUrls(need,6*3600);if(error)throw error;(data||[]).forEach(x=>{if(x.signedUrl)PH.url[x.path]=x.signedUrl})}catch(e){console.warn(e)}
 need.forEach(p=>PH.pending.delete(p));document.querySelectorAll("img[data-ph]:not([src])").forEach(i=>{const u=PH.url[i.dataset.ph];if(u)i.src=u})}
{const _rc=render;render=function(){_rc();if(TEAM&&teamHas("desafios")){setTimeout(chLoadPhotos,0);if(UI.tab==="chal"||UI.tab==="home")setTimeout(chAutoCheck,50)}}}

function chCard(c){const r=chRank(c);const me=r.find(x=>x.u===ME.uid)||{p:0,today:false};const end=chEnd(c);const left=Math.max(0,(parseDate(end)-parseDate(today()))/864e5);const act=chActive(c);
 return `<button class="card stack" style="text-align:left;gap:8px" data-act="chalOpen" data-v="${c.id}"><div class="row between"><b style="font-size:16px">${esc(c.name)}</b><span class="pill ${act?"good":today()<c.start?"info":""}" style="padding:1px 8px">${act?`faltam ${Math.round(left)+1} dia${left?"s":""}`:today()<c.start?"começa "+ddmm(c.start):"terminou"}</span></div>
 <div class="row" style="gap:6px;flex-wrap:wrap">${r.slice(0,3).map((x,i)=>`<span class="chip" style="cursor:default">${i===0&&x.p?"👑 ":""}<span class="avatar">${teamInitials(x.u)}</span>${x.p}</span>`).join("")}</div>
 ${act?`<span class="small">${me.today?"✅ Você já fez o check-in de hoje.":"Seu check-in de hoje ainda está pendente."} ${me.p} ponto${me.p===1?"":"s"}.</span>`:""}</button>`}
function viewChal(){if(!TEAM||!teamHas("desafios")){UI.tab="home";return viewHome()}if(UI.chalOpen&&CHP().items[UI.chalOpen])return chDetail(CHP().items[UI.chalOpen]);UI.chalOpen=null;
 const all=vals(CHP().items).sort((a,b)=>(b.start||"").localeCompare(a.start||""));const act=all.filter(c=>today()<=chEnd(c)),old=all.filter(c=>today()>chEnd(c));
 return `<div class="stack"><h1 style="margin-top:4px">Desafios</h1>
 <div class="card row" style="gap:12px"><span style="width:64px;flex:none">${pigSVG({score:85,mood:"feliz",equip:{head:"coroa"},env:0,mini:true})}</span><div class="stack-s" style="gap:2px"><b>Junto fica mais fácil</b><span class="small muted">Criem um desafio, façam o check-in todo dia com uma foto e vejam quem está mandando bem. Cada dia cumprido vale 1 ponto.</span></div></div>

function chDetail(c){const r=chRank(c);const me=r.find(x=>x.u===ME.uid)||{};const act=chActive(c);const allToday=act&&r.length>1&&r.every(x=>x.today);
 const feed=[];for(const [u,days] of Object.entries(c.checkins||{}))for(const [d,ck] of Object.entries(days||{}))if(ck)feed.push({u,d,ck});feed.sort((a,b)=>(b.ck.t||0)-(a.ck.t||0));

  <span class="tiny muted">${ddmm(c.start)} a ${ddmm(chEnd(c))} · ${c.auto&&c.auto!=="none"?`check-in automático: ${(CH_AUTO.find(x=>x[0]===c.auto)||["",""])[1].toLowerCase()}`:"cada um marca o seu check-in"}</span>
  ${chLive(c)?`<span class="small">📸 Só vale foto tirada na hora, pela câmera do Prumo</span>`:c.photo==="req"?`<span class="small">📸 Check-in só com foto</span>`:""}
  ${c.prize?`<span class="small">🏆 Prêmio: <b>${esc(c.prize)}</b></span>`:""}
  ${act?(me.today?`<div class="banner info"><div class="stack-s" style="gap:6px"><span>✅ Check-in de hoje feito${(((c.checkins||{})[ME.uid]||{})[today()]||{}).auto?" automaticamente":""}! ${me.s>1?`Sequência de ${me.s} dias.`:""}</span><button class="btn line sm" data-act="chalEdit2" data-c="${c.id}" data-d="${today()}" style="align-self:flex-start">${(((c.checkins||{})[ME.uid]||{})[today()]||{}).photo||(((c.checkins||{})[ME.uid]||{})[today()]||{}).photoData?"Editar check-in":"📸 Pôr foto ou comentário"}</button></div></div>`:`<button class="btn block" data-act="chalCheckin">📸 Fazer meu check-in de hoje</button>`):today()<c.start?`<div class="banner info"><span>O desafio começa em ${dayLabel(c.start)}.</span></div>`:`<div class="banner info"><span>Desafio encerrado. ${r[0]&&r[0].p?`Campeão: <b>${esc(nm(r[0].u))}</b> com ${r[0].p} pontos!`:""}</span></div>`}
 </div>

 <div class="card stack"><div class="label">Ranking</div><div class="list">${r.map((x,i)=>`<div class="item"><b class="num" style="width:22px">${i+1}</b><span class="avatar">${teamInitials(x.u)}</span><span class="grow">${i===0&&x.p?"👑 ":""}${esc(nm(x.u))}${x.today?" <span class='tiny' title='Fez hoje'>✅</span>":""}</span><span class="tiny muted">${x.s>1?`🔥 ${x.s} · `:""}</span><b class="num">${x.p} pt${x.p===1?"":"s"}</b></div>`).join("")}</div></div>
 <div class="section"><div class="label">Mural</div>
 ${feed.length?feed.slice(0,UI.chFeedN||15).map(f=>{const rs=f.ck.r||{};return `<div class="card stack" style="gap:8px;padding:12px">

  ${chPhotoTag(f.ck)}${f.ck.note?`<p class="small">${esc(f.ck.note)}</p>`:""}

  <span style="width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:${n.read_at?"transparent":"var(--pig-deep)"}"></span>
